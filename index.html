<html lang="ja">

<meta charset="UTF-8">

<title>🏰 TDL AI NAVI</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
  background:#f6f7fb;
  color:#222;
}

header{
  position:sticky;
  top:0;
  z-index:100;
  background:rgba(255,255,255,.96);
  backdrop-filter:blur(10px);
  border-bottom:1px solid #ddd;
  padding:14px 16px;
}

header h1{
  margin:0;
  font-size:20px;
}

header p{
  margin:4px 0 0;
  color:#777;
  font-size:12px;
}

.container{
  max-width:900px;
  margin:auto;
  padding:16px;
}

.section{
  margin-bottom:22px;
}

.section-title{
  font-size:18px;
  font-weight:bold;
  margin-bottom:10px;
}

.area-buttons{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px;
}

.area-btn{
  border:0;
  background:white;
  padding:12px 8px;
  border-radius:12px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
  font-size:14px;
  cursor:pointer;
}

.area-btn.active{
  background:#222;
  color:white;
}

.search{
  width:100%;
  padding:13px 14px;
  border:1px solid #ddd;
  border-radius:12px;
  font-size:16px;
  background:white;
}

.cards{
  display:grid;
  gap:10px;
}

.card{
  background:white;
  border-radius:14px;
  overflow:hidden;
  box-shadow:0 2px 9px rgba(0,0,0,.07);
  cursor:pointer;
}

.card-main{
  display:flex;
  align-items:center;
  min-height:88px;
}

.card-image{
  width:105px;
  height:88px;
  flex:none;
  object-fit:cover;
  background:#eee;
}

.card-image.placeholder{
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:30px;
}

.card-info{
  padding:10px 12px;
}

.card-title{
  font-weight:bold;
  font-size:15px;
}

.card-area{
  margin-top:5px;
  color:#888;
  font-size:12px;
}

.selected{
  background:#222;
  color:white;
  border-radius:15px;
  padding:15px;
  margin-bottom:18px;
}

.selected-title{
  font-size:18px;
  font-weight:bold;
}

.selected-area{
  color:#bbb;
  font-size:12px;
  margin-top:3px;
}

.selected-link{
  display:inline-block;
  margin-top:10px;
  color:white;
  font-size:12px;
}

.category{
  margin-top:18px;
}

.category-title{
  font-weight:bold;
  margin-bottom:8px;
}

/* 周辺施設を2列 */

.mini-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:8px;
}

.mini-card{
  display:flex;
  flex-direction:column;
  background:white;
  border-radius:12px;
  overflow:hidden;
  box-shadow:0 2px 7px rgba(0,0,0,.06);
  cursor:pointer;
  min-width:0;
}

.mini-image{
  width:100%;
  height:105px;
  object-fit:cover;
  background:#eee;
  flex:none;
}

.mini-image.placeholder{
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:24px;
}

.mini-info{
  padding:9px;
}

.mini-name{
  font-size:13px;
  font-weight:bold;
  line-height:1.35;
}

.mini-area{
  color:#888;
  font-size:10px;
  margin-top:4px;
}

.mini-distance{
  color:#2878d8;
  font-size:11px;
  font-weight:bold;
  margin-top:5px;
  line-height:1.4;
}

.photo-card{
  background:white;
  border-radius:13px;
  padding:13px;
  box-shadow:0 2px 7px rgba(0,0,0,.06);
}

.photo-icon{
  font-size:30px;
}

.photo-title{
  font-weight:bold;
  margin-top:5px;
}

.photo-description{
  color:#666;
  font-size:12px;
  margin-top:4px;
  line-height:1.5;
}

.photo-source{
  font-size:11px;
  margin-top:8px;
}

.photo-source a{
  color:#2878d8;
}

.hidden{
  display:none;
}

.count{
  color:#888;
  font-size:12px;
  margin:8px 0;
}

.loading{
  color:#999;
  font-size:12px;
  padding:10px 0;
}

.image-loading{
  position:relative;
}

.image-loading::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(
    90deg,
    #eee 25%,
    #f7f7f7 50%,
    #eee 75%
  );
  background-size:200% 100%;
  animation:imageShimmer 1.2s infinite;
}

@keyframes imageShimmer{
  from{
    background-position:200% 0;
  }
  to{
    background-position:-200% 0;
  }
}

/* PC */

@media(min-width:700px){

  .area-buttons{
    grid-template-columns:repeat(4,1fr);
  }

  .cards{
    grid-template-columns:repeat(2,1fr);
  }

  .mini-grid{
    grid-template-columns:repeat(3,minmax(0,1fr));
  }

}

/* 小さいスマホ */

@media(max-width:380px){

  .mini-grid{
    gap:6px;
  }

  .mini-image{
    height:90px;
  }

  .mini-info{
    padding:7px;
  }

  .mini-name{
    font-size:12px;
  }

}

</style>
</head>

/* =========================================================
   徒歩距離設定
========================================================= */

/*
  園内を普通に歩く速度を約65m/分として計算。
  直線距離だけでは実際より短くなるため、
  パーク内の通路・迂回を考慮して1.45倍。
*/

const WALKING_SPEED = 65;

const WALKING_FACTOR = 1.45;

const MAX_WALKING_DISTANCE = 325;


/* =========================================================
   距離計算
========================================================= */

function calculateDistance(name1,name2){

  const a =
    LOCATIONS[name1];

  const b =
    LOCATIONS[name2];

  if(!a || !b){
    return 9999;
  }

  const dx =
    a[0] - b[0];

  const dy =
    a[1] - b[1];

  const straight =
    Math.sqrt(
      dx * dx +
      dy * dy
    );

  return straight * WALKING_FACTOR;

}


function walkingMinutes(distance){

  return Math.max(
    1,
    Math.ceil(
      distance / WALKING_SPEED
    )
  );

}


/* =========================================================
   徒歩5分圏内取得
========================================================= */

function getNearby(
  list,
  selectedName
){

  return list

    .filter(item =>
      item[0] !== selectedName
    )

    .map(item => {

      const distance =
        calculateDistance(
          selectedName,
          item[0]
        );

      return {
        item:item,
        distance:distance,
        minutes:
          walkingMinutes(distance)
      };

    })

    .filter(result =>
      result.distance <=
      MAX_WALKING_DISTANCE
    )

    .sort((a,b) =>
      a.distance -
      b.distance
    );

}


/* =========================================================
   画像キャッシュ
========================================================= */

const IMAGE_CACHE_KEY =
  "tdl_ai_navi_image_cache_v3";

let imageCache = {};

try{

  imageCache =
    JSON.parse(
      localStorage.getItem(
        IMAGE_CACHE_KEY
      ) || "{}"
    );

}catch(e){

  imageCache = {};

}


function saveImageCache(){

  try{

    localStorage.setItem(
      IMAGE_CACHE_KEY,
      JSON.stringify(
        imageCache
      )
    );

  }catch(e){}

}


function imageKey(name){

  return String(name);

}


function getKnownImage(name){

  const key =
    imageKey(name);

  if(imageCache[key]){
    return imageCache[key];
  }

  if(DIRECT_IMAGES[name]){
    return DIRECT_IMAGES[name];
  }

  return null;

}


/* =========================================================
   公式ページURL
========================================================= */

function getDetailURL(
  type,
  id
){

  if(type === "attraction"){

    return `${OFFICIAL}/tdl/attraction/detail/${id}/`;

  }

  if(type === "restaurant"){

    return `${OFFICIAL}/tdl/restaurant/detail/${id}/`;

  }

  if(type === "shop"){

    return `${OFFICIAL}/tdl/shop/detail/${id}/`;

  }

  return null;

}


/* =========================================================
   Jinaから公式画像取得
========================================================= */

async function fetchOfficialImage(
  name,
  type,
  id
){

  const key =
    imageKey(name);

  const known =
    getKnownImage(name);

  if(known){
    return known;
  }

  const pageURL =
    getDetailURL(
      type,
      id
    );

  if(!pageURL){
    return null;
  }

  try{

    const response =
      await fetch(
        "https://r.jina.ai/" +
        pageURL,
        {
          cache:"force-cache"
        }
      );

    if(!response.ok){
      return null;
    }

    const text =
      await response.text();

    let match =
      text.match(
        /\[Image:\s*[^\]]*?イメージ\s*1[^\]]*\]\((https:\/\/media1\.tokyodisneyresort\.jp\/[^)\s]+)\)/i
      );

    if(!match){

      match =
        text.match(
          /!\[[^\]]*?イメージ\s*1[^\]]*\]\((https:\/\/media1\.tokyodisneyresort\.jp\/[^)\s]+)\)/i
        );

    }

    if(!match){

      match =
        text.match(
          /Image:\s*[^\n]*?イメージ\s*1[^\n]*?\((https:\/\/media1\.tokyodisneyresort\.jp\/[^)\s]+)\)/i
        );

    }

    if(!match){

      match =
        text.match(
          /(?:alt|title)=["'][^"']*?イメージ\s*1[^"']*["'][^>]*?src=["'](https:\/\/media1\.tokyodisneyresort\.jp\/[^"']+)["']/i
        );

    }

    if(!match){

      match =
        text.match(
          /src=["'](https:\/\/media1\.tokyodisneyresort\.jp\/[^"']+)["'][^>]*(?:alt|title)=["'][^"']*?イメージ\s*1/i
        );

    }

    if(!match){
      return null;
    }

    const imageURL =
      match[1]
        .replace(
          /&amp;/g,
          "&"
        )
        .replace(
          /\\u0026/g,
          "&"
        );

    if(
      !imageURL.includes(
        "media1.tokyodisneyresort.jp"
      )
    ){
      return null;
    }

    imageCache[key] =
      imageURL;

    saveImageCache();

    return imageURL;

  }catch(error){

    console.log(
      "画像取得失敗:",
      name,
      error
    );

    return null;

  }

}


/* =========================================================
   画像Observer
========================================================= */

const imageObserver =
  new IntersectionObserver(

    entries => {

      entries.forEach(
        entry => {

          if(
            !entry.isIntersecting
          ){
            return;
          }

          const element =
            entry.target;

          imageObserver.unobserve(
            element
          );

          loadLazyImage(
            element
          );

        }
      );

    },

    {
      rootMargin:
        "500px 0px"
    }

  );


/* =========================================================
   Lazy画像
========================================================= */

async function loadLazyImage(
  element
){

  if(
    element.dataset.loaded ===
    "true" ||

    element.dataset.loading ===
    "true"
  ){

    return;

  }

  element.dataset.loading =
    "true";

  const name =
    element.dataset.name;

  const type =
    element.dataset.type;

  const id =
    element.dataset.id;


  let url =
    getKnownImage(name);


  if(!url){

    url =
      await fetchOfficialImage(
        name,
        type,
        id
      );

  }


  if(url){

    const img =
      document.createElement(
        "img"
      );

    img.className =
      element.dataset.small ===
      "true"
        ? "mini-image"
        : "card-image";

    img.alt =
      name;

    img.loading =
      "lazy";

    img.decoding =
      "async";

    img.referrerPolicy =
      "no-referrer";

    img.src =
      url;

    img.dataset.fallbackTried =
      element.dataset
        .fallbackTried ||
      "false";


    img.onload = () => {

      element.replaceWith(
        img
      );

    };


    img.onerror =
      async () => {

        if(
          img.dataset
            .fallbackTried ===
          "false" &&

          !DIRECT_IMAGES[name]
        ){

          delete imageCache[
            imageKey(name)
          ];

          saveImageCache();

          element.dataset.loading =
            "false";

          element.dataset.fallbackTried =
            "true";

          await loadLazyImage(
            element
          );

        }else{

          element.classList.remove(
            "image-loading"
          );

        }

      };


    return;

  }


  element.dataset.loading =
    "false";

  element.classList.remove(
    "image-loading"
  );

}


/* =========================================================
   画像HTML
========================================================= */

function imageHTML(
  name,
  small=false,
  type="attraction",
  id=""
){

  const url =
    getKnownImage(name);


  if(url){

    return `

      <img
        class="${
          small
            ? "mini-image"
            : "card-image"
        }"
        src="${url}"
        alt="${escapeHTML(name)}"
        loading="lazy"
        decoding="async"
        fetchpriority="${
          small
            ? "low"
            : "auto"
        }"
        referrerpolicy="no-referrer"
      >

    `;

  }


  return `

    <div

      class="${
        small
          ? "mini-image"
          : "card-image"
      } placeholder image-loading lazy-image"

      data-name="${escapeHTML(name)}"

      data-type="${escapeHTML(type)}"

      data-id="${escapeHTML(id)}"

      data-small="${
        small
          ? "true"
          : "false"
      }"

      data-fallback-tried="false"

    >

      ${
        small
          ? "📍"
          : "🎢"
      }

    </div>

  `;

}


/* =========================================================
   Lazy画像監視
========================================================= */

function observeLazyImages(){

  document
    .querySelectorAll(
      ".lazy-image:not([data-observing])"
    )
    .forEach(
      element => {

        element.dataset.observing =
          "true";

        imageObserver.observe(
          element
        );

      }
    );

}


/* =========================================================
   HTMLエスケープ
========================================================= */

function escapeHTML(str){

  return String(str)

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );

}

        item[1];

      const div =
        document.createElement(

      else if(
        type ===

      ){

        link =

      else if(
        type ===
        "shop"
      ){

        link =

          name,

          window.open(

          );

        }

      };


      grid.appendChild(
        div
      );

    }
  );


  container.appendChild(
    grid
  );


  observeLazyImages();

}

        "async";

      img.src =
        url;

    }
  );

}


/* =========================================================
   初期表示
========================================================= */

renderAttractions();


/* =========================================================
   重要画像先読み
========================================================= */

if(
  "requestIdleCallback"
  in window
){

  requestIdleCallback(
    preloadImportantImages
  );

}else{

  setTimeout(
    preloadImportantImages,
    300
  );

}

</script>

<script>
/* =========================================================
   TDL AI NAVI
   画像修正版 v4
   ========================================================= */

(function(){

  const IMAGE_CACHE_KEY = "tdl_ai_navi_image_cache_v4";

  /* 古い画像キャッシュを使用しない */
  try {
    localStorage.removeItem("tdl_ai_navi_image_cache_v3");
  } catch(e){}

  let cache = {};

  try {
    cache = JSON.parse(
      localStorage.getItem(IMAGE_CACHE_KEY) || "{}"
    );
  } catch(e) {
    cache = {};
  }

  function saveCache(){
    try{
      localStorage.setItem(
        IMAGE_CACHE_KEY,
        JSON.stringify(cache)
      );
    }catch(e){}
  }


  /* -----------------------------------------
     施設IDの修正
  ----------------------------------------- */

  const ID_FIX = {

    "restaurant:センターストリート・コーヒーハウス":
      "306",

    "restaurant:チャイナボイジャー":
      "332"

  };


  function fixedId(name,type,id){

    return (
      ID_FIX[type + ":" + name] ||
      String(id)
    );

  }


  /* -----------------------------------------
     施設を一意に識別する
  ----------------------------------------- */

  function cacheKey(name,type,id){

    return [
      type,
      fixedId(name,type,id),
      name
    ].join("|");

  }


  /* -----------------------------------------
     公式ページURL
  ----------------------------------------- */

  function officialPage(name,type,id){

    const realId =
      fixedId(name,type,id);

    if(type === "attraction"){
      return (
        OFFICIAL +
        "/tdl/attraction/detail/" +
        realId +
        "/"
      );
    }

    if(type === "restaurant"){
      return (
        OFFICIAL +
        "/tdl/restaurant/detail/" +
        realId +
        "/"
      );
    }

    if(type === "shop"){
      return (
        OFFICIAL +
        "/tdl/shop/detail/" +
        realId +
        "/"
      );
    }

    return null;

  }


  /* -----------------------------------------
     公式画像を取得
  ----------------------------------------- */

  async function getOfficialImage(
    name,
    type,
    id
  ){

    const key =
      cacheKey(name,type,id);


    /*
      直接確認済み画像を最優先
    */

    if(
      typeof DIRECT_IMAGES !== "undefined" &&
      DIRECT_IMAGES[name]
    ){

      cache[key] =
        DIRECT_IMAGES[name];

      saveCache();

      return DIRECT_IMAGES[name];

    }


    /*
      v4キャッシュ
    */

    if(cache[key]){
      return cache[key];
    }


    const page =
      officialPage(
        name,
        type,
        id
      );


    if(!page){
      return null;
    }


    try{

      const res =
        await fetch(
          "https://r.jina.ai/" + page,
          {
            cache:"no-store"
          }
        );


      if(!res.ok){
        return null;
      }


      const text =
        await res.text();


      /*
        media1.tokyodisneyresort.jp
        の画像だけを抽出
      */

      const urls =
        text.match(
          /https:\/\/media1\.tokyodisneyresort\.jp\/[^)\s"'<>]+/gi
        ) || [];


      const cleaned = [];

      urls.forEach(function(url){

        url =
          url
            .replace(/&amp;/g,"&")
            .replace(/\\u0026/g,"&")
            .trim();


        if(
          !url.includes(
            "media1.tokyodisneyresort.jp"
          )
        ){
          return;
        }


        if(
          /map/i.test(url)
        ){
          return;
        }


        if(
          /logo/i.test(url)
        ){
          return;
        }


        if(
          !cleaned.includes(url)
        ){
          cleaned.push(url);
        }

      });


      if(!cleaned.length){
        return null;
      }


      /*
        まず「イメージ1」を探す
      */

      let selected =
        null;


      const image1 =
        text.match(
          /イメージ\s*1[\s\S]{0,500}?(https:\/\/media1\.tokyodisneyresort\.jp\/[^)\s"'<>]+)/i
        );


      if(image1){

        selected =
          image1[1]
            .replace(/&amp;/g,"&")
            .replace(/\\u0026/g,"&");

      }


      /*
        イメージ1が見つからない場合は
        公式ページ内の最初のmedia1画像
      */

      if(!selected){

        selected =
          cleaned[0];

      }


      if(!selected){
        return null;
      }


      cache[key] =
        selected;

      saveCache();


      return selected;


    }catch(error){

      console.log(
        "画像取得失敗:",
        name,
        type,
        id,
        error
      );

      return null;

    }

  }


  /* -----------------------------------------
     画像を実際に表示
  ----------------------------------------- */

  async function loadImage(el){

    if(
      !el ||
      el.dataset.imageLoading === "true"
    ){
      return;
    }


    el.dataset.imageLoading =
      "true";


    const name =
      el.dataset.name;

    const type =
      el.dataset.type;

    const id =
      el.dataset.id;


    const small =
      el.dataset.small === "true";


    const url =
      await getOfficialImage(
        name,
        type,
        id
      );


    if(!url){

      el.dataset.imageLoading =
        "false";

      el.classList.remove(
        "image-loading"
      );

      return;

    }


    const img =
      document.createElement("img");


    img.className =
      small
        ? "mini-image"
        : "card-image";


    img.alt =
      name;


    img.loading =
      "lazy";


    img.decoding =
      "async";


    img.referrerPolicy =
      "no-referrer";


    img.src =
      url;


    img.onload =
      function(){

        el.replaceWith(img);

      };


    img.onerror =
      async function(){

        /*
          壊れたキャッシュを削除
        */

        const key =
          cacheKey(
            name,
            type,
            id
          );


        delete cache[key];

        saveCache();


        /*
          直接画像以外は一度だけ再取得
        */

        if(
          el.dataset.retry !== "true"
        ){

          el.dataset.retry =
            "true";

          el.dataset.imageLoading =
            "false";

          await loadImage(el);

          return;

        }


        el.dataset.imageLoading =
          "false";

        el.classList.remove(
          "image-loading"
        );

      };

  }


  /* -----------------------------------------
     既存の画像プレースホルダーを監視
  ----------------------------------------- */

  function observeImages(){

    const elements =
      document.querySelectorAll(
        ".lazy-image"
      );


    elements.forEach(function(el){

      if(
        el.dataset.imageObserved ===
        "true"
      ){
        return;
      }


      el.dataset.imageObserved =
        "true";


      const observer =
        new IntersectionObserver(
          function(entries){

            entries.forEach(
              function(entry){

                if(
                  !entry.isIntersecting
                ){
                  return;
                }


                observer.unobserve(
                  entry.target
                );


                loadImage(
                  entry.target
                );

              }
            );

          },
          {
            rootMargin:
              "800px 0px"
          }
        );


      observer.observe(el);

    });

  }


  /* -----------------------------------------
     imageHTMLを上書き
     -----------------------------------------
     
     既存の施設データを変更せず、
     新しい画像処理だけ使う。
  ----------------------------------------- */

  const originalImageHTML =
    window.imageHTML;


  window.imageHTML =
    function(
      name,
      small=false,
      type="attraction",
      id=""
    ){

      const realId =
        fixedId(
          name,
          type,
          id
        );


      /*
        直接確認済み画像
      */

      if(
        typeof DIRECT_IMAGES !== "undefined" &&
        DIRECT_IMAGES[name]
      ){

        return `
          <img
            class="${small ? "mini-image" : "card-image"}"
            src="${DIRECT_IMAGES[name]}"
            alt="${escapeHTML(name)}"
            loading="lazy"
            decoding="async"
            referrerpolicy="no-referrer"
          >
        `;

      }


      return `
        <div
          class="${small ? "mini-image" : "card-image"}
          placeholder
          image-loading
          lazy-image"

          data-name="${escapeHTML(name)}"
          data-type="${escapeHTML(type)}"
          data-id="${escapeHTML(realId)}"
          data-small="${small ? "true" : "false"}"
          data-retry="false"
        ></div>
      `;

    };


  /* -----------------------------------------
     画面内の画像を処理
  ----------------------------------------- */

  function refreshImages(){

    observeImages();

  }


  /*
    DOM更新後にも画像監視
  */

  const originalRender =
    window.renderAttractions;


  if(typeof originalRender === "function"){

    window.renderAttractions =
      function(){

        originalRender();

        setTimeout(
          refreshImages,
          50
        );

      };

  }


  /*
    周辺施設表示後にも監視
  */

  const originalRenderNearby =
    window.renderNearby;


  if(typeof originalRenderNearby === "function"){

    window.renderNearby =
      function(){

        originalRenderNearby();

        setTimeout(
          refreshImages,
          50
        );

      };

  }


  /*
    初回
  */

  setTimeout(
    refreshImages,
    300
  );


  /*
    画像が追加された場合にも対応
  */

  const mutation =
    new MutationObserver(
      function(){

        refreshImages();

      }
    );


  mutation.observe(
    document.body,
    {
      childList:true,
      subtree:true
    }
  );


})();
</script>
</body>
