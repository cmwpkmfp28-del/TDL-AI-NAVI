*{

body{

  color:#222;
}

header{
  position:sticky;
  top:0;
  z-index:100;
  background:rgba(255,255,255,.96);
  backdrop-filter:blur(10px);
  border-bottom:1px solid #ddd;
  padding:14px 16px;
}

header h1{
  margin:0;
  font-size:20px;
}

header p{
  margin:4px 0 0;
  color:#777;
  font-size:12px;
}

.container{
  max-width:900px;
  margin:auto;
  padding:16px;
}

.section{
  margin-bottom:22px;
}

.section-title{
  font-size:18px;
  font-weight:bold;
  margin-bottom:10px;
}

.area-buttons{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px;
}

.area-btn{
  border:0;
  background:white;
  padding:12px 8px;
  border-radius:12px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
  font-size:14px;
  cursor:pointer;
}

.area-btn.active{
  background:#222;
  color:white;
}

.search{
  width:100%;
  padding:13px 14px;
  border:1px solid #ddd;
  border-radius:12px;
  font-size:16px;
  background:white;
}

.cards{
  display:grid;
  gap:10px;
}

.card{
  background:white;
  border-radius:14px;
  overflow:hidden;
  box-shadow:0 2px 9px rgba(0,0,0,.07);
  cursor:pointer;
}

.card-main{
  display:flex;
  align-items:center;
  min-height:88px;
}

.card-image{
  width:105px;
  height:88px;
  flex:none;
  object-fit:cover;
  background:#eee;
}

.card-image.placeholder{
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:30px;
}

.card-info{
  padding:10px 12px;
}

.card-title{
  font-weight:bold;
  font-size:15px;
}

.card-area{
  margin-top:5px;
  color:#888;
  font-size:12px;
}

.selected{
  background:#222;
  color:white;
  border-radius:15px;
  padding:15px;
  margin-bottom:18px;
}

.selected-main{
  display:flex;
  gap:12px;
  align-items:center;
}

.selected-image{
  width:100px;
  height:80px;
  flex:none;
  object-fit:cover;
  border-radius:10px;
  background:#333;
}

.selected-image.placeholder{
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:28px;
}

.selected-info{
  min-width:0;
}

.selected-title{
  font-size:18px;
  font-weight:bold;
}

.selected-area{
  color:#bbb;
  font-size:12px;
  margin-top:3px;
}

.selected-link{
  display:inline-block;
  margin-top:10px;
  color:white;
  font-size:12px;
}

.category{
  margin-top:18px;
}

.category-title{
  font-weight:bold;
  margin-bottom:8px;
}

.mini-card{
  display:flex;
  background:white;
  border-radius:12px;
  margin-bottom:8px;
  overflow:hidden;
  box-shadow:0 2px 7px rgba(0,0,0,.06);
}

.mini-image{
  width:90px;
  height:75px;
  object-fit:cover;
  background:#eee;
  flex:none;
}

.mini-image.placeholder{

  align-items:center;
  justify-content:center;
  font-size:24px;

.mini-info{

.mini-name{
  font-size:14px;
  font-weight:bold;
}

.mini-area{
  color:#888;
  font-size:11px;

.distance{

  font-size:12px;
  font-weight:bold;
  margin-top:5px;

.photo-card{

  border-radius:13px;

.photo-icon{

.photo-title{
  font-weight:bold;

}

.photo-description{

.photo-source{

.photo-distance{

  font-size:12px;
  font-weight:bold;
  margin-top:7px;

.hidden{
  display:none;
}

.count{
  color:#888;
  font-size:12px;
  margin:8px 0;
}

.loading{
  color:#999;
  font-size:12px;
  padding:10px 0;
}

.image-loading{
  position:relative;
}

.image-loading::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(
    90deg,
    #eee 25%,
    #f7f7f7 50%,
    #eee 75%
  );
  background-size:200% 100%;
  animation:imageShimmer 1.2s infinite;
}

@keyframes imageShimmer{
  from{
    background-position:200% 0;
  }
  to{
    background-position:-200% 0;
  }
}

@media(min-width:700px){
  .area-buttons{
    grid-template-columns:repeat(4,1fr);
  }

  .cards{
    grid-template-columns:repeat(2,1fr);
  }
}
</style>

/* =========================================================
   画像キャッシュ
========================================================= */

const IMAGE_CACHE_KEY =
  "tdl_ai_navi_image_cache_v3";

let imageCache = {};

try{

  imageCache =
    JSON.parse(
      localStorage.getItem(
        IMAGE_CACHE_KEY
      ) || "{}"
    );

}catch(e){

  imageCache = {};

}


function saveImageCache(){

  try{

    localStorage.setItem(
      IMAGE_CACHE_KEY,
      JSON.stringify(imageCache)
    );

  }catch(e){}

}


function imageKey(name){

  return String(name);

}


function getKnownImage(name){

  const key =
    imageKey(name);

  if(imageCache[key]){
    return imageCache[key];
  }

  if(DIRECT_IMAGES[name]){
    return DIRECT_IMAGES[name];
  }

  return null;

}


/* =========================================================
   公式ページURL
========================================================= */

function getDetailURL(type,id){

  if(type === "attraction"){
    return `${OFFICIAL}/tdl/attraction/detail/${id}/`;
  }

  if(type === "restaurant"){
    return `${OFFICIAL}/tdl/restaurant/detail/${id}/`;
  }

  if(type === "shop"){
    return `${OFFICIAL}/tdl/shop/detail/${id}/`;
  }

  return null;

}


/* =========================================================
   公式画像取得
========================================================= */

async function fetchOfficialImage(
  name,
  type,
  id
){

  const key =
    imageKey(name);

  const known =
    getKnownImage(name);

  if(known){
    return known;
  }

  const pageURL =
    getDetailURL(type,id);

  if(!pageURL){
    return null;
  }

  try{

    const response =
      await fetch(
        "https://r.jina.ai/" +
        pageURL,
        {
          cache:"force-cache"
        }
      );

    if(!response.ok){
      return null;
    }

    const text =
      await response.text();

    let match =
      text.match(
        /\[Image:\s*[^\]]*?イメージ\s*1[^\]]*\]\((https:\/\/media1\.tokyodisneyresort\.jp\/[^)\s]+)\)/i
      );

    if(!match){

      match =
        text.match(
          /!\[[^\]]*?イメージ\s*1[^\]]*\]\((https:\/\/media1\.tokyodisneyresort\.jp\/[^)\s]+)\)/i
        );

    }

    if(!match){

      match =
        text.match(
          /Image:\s*[^\n]*?イメージ\s*1[^\n]*?\((https:\/\/media1\.tokyodisneyresort\.jp\/[^)\s]+)\)/i
        );

    }

    if(!match){

      match =
        text.match(
          /(?:alt|title)=["'][^"']*?イメージ\s*1[^"']*["'][^>]*?src=["'](https:\/\/media1\.tokyodisneyresort\.jp\/[^"']+)["']/i
        );

    }

    if(!match){

      match =
        text.match(
          /src=["'](https:\/\/media1\.tokyodisneyresort\.jp\/[^"']+)["'][^>]*(?:alt|title)=["'][^"']*?イメージ\s*1/i
        );

    }

    if(!match){
      return null;
    }

    const imageURL =
      match[1]
        .replace(/&amp;/g,"&")
        .replace(/\\u0026/g,"&");

    if(
      !imageURL.includes(
        "media1.tokyodisneyresort.jp"
      )
    ){
      return null;
    }

    imageCache[key] =
      imageURL;

    saveImageCache();

    return imageURL;

  }catch(error){

    console.log(
      "画像取得失敗:",
      name,
      error
    );

    return null;

  }

}


/* =========================================================
   画像Observer
========================================================= */

const imageObserver =
  new IntersectionObserver(
    entries => {

      entries.forEach(entry => {

        if(!entry.isIntersecting){
          return;
        }

        const element =
          entry.target;

        imageObserver.unobserve(
          element
        );

        loadLazyImage(
          element
        );

      });

    },
    {
      rootMargin:"500px 0px"
    }
  );


/* =========================================================
   lazy画像
========================================================= */

async function loadLazyImage(
  element
){

  if(
    element.dataset.loaded === "true" ||
    element.dataset.loading === "true"
  ){
    return;
  }

  element.dataset.loading =
    "true";

  const name =
    element.dataset.name;

  const type =
    element.dataset.type;

  const id =
    element.dataset.id;

  let url =
    getKnownImage(name);

  if(!url){

    url =
      await fetchOfficialImage(
        name,
        type,
        id
      );

  }

  if(url){

    const img =
      document.createElement("img");

    const isSelected =
      element.dataset.selected === "true";

    if(isSelected){

      img.className =
        "selected-image";

    }else{

      img.className =
        element.dataset.small === "true"
          ? "mini-image"
          : "card-image";

    }

    img.alt =
      name;

    img.loading =
      "lazy";

    img.decoding =
      "async";

    img.referrerPolicy =
      "no-referrer";

    img.src =
      url;

    img.onload = () => {

      element.replaceWith(
        img
      );

    };

    img.onerror = async () => {

      if(
        !DIRECT_IMAGES[name] &&
        !element.dataset.fallbackTried
      ){

        delete imageCache[
          imageKey(name)
        ];

        saveImageCache();

        element.dataset.loading =
          "false";

        element.dataset.fallbackTried =
          "true";

        await loadLazyImage(
          element
        );

      }else{

        element.classList.remove(
          "image-loading"
        );

      }

    };

    return;

  }

  element.dataset.loading =
    "false";

  element.classList.remove(
    "image-loading"
  );

}


/* =========================================================
   画像HTML
========================================================= */

function imageHTML(
  name,
  small=false,
  type="attraction",
  id=""
){

  const url =
    getKnownImage(name);

  if(url){

    return `
      <img
        class="${small ? "mini-image" : "card-image"}"
        src="${url}"
        alt="${escapeHTML(name)}"
        loading="lazy"
        decoding="async"
        fetchpriority="${small ? "low" : "auto"}"
        referrerpolicy="no-referrer"
      >
    `;

  }

  return `
    <div
      class="${small ? "mini-image" : "card-image"} placeholder image-loading lazy-image"
      data-name="${escapeHTML(name)}"
      data-type="${escapeHTML(type)}"
      data-id="${escapeHTML(id)}"
      data-small="${small ? "true" : "false"}"
      data-fallback-tried="false"
    >
      ${small ? "📍" : "🎢"}
    </div>
  `;

}


/* =========================================================
   選択中アトラクション画像
========================================================= */

function selectedImageHTML(
  name,
  type,
  id
){

  const url =
    getKnownImage(name);

  if(url){

    return `
      <img
        class="selected-image"
        src="${url}"
        alt="${escapeHTML(name)}"
        fetchpriority="high"
        decoding="async"
        referrerpolicy="no-referrer"

  }

  return `
    <div
      class="selected-image placeholder image-loading lazy-image"
      data-name="${escapeHTML(name)}"
      data-type="${escapeHTML(type)}"
      data-id="${escapeHTML(id)}"
      data-selected="true"
      data-fallback-tried="false"
    >
      🎢
    </div>
  `;

}


/* =========================================================
   lazy画像監視
========================================================= */

function observeLazyImages(){

  document
    .querySelectorAll(
      ".lazy-image:not([data-observing])"
    )
    .forEach(element => {

      element.dataset.observing =
        "true";

      imageObserver.observe(
        element
      );

    });

}


/* =========================================================
   HTMLエスケープ
========================================================= */

function escapeHTML(str){

  return String(str)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


/* =========================================================
   座標から距離を計算
========================================================= */

function getLocation(name){

  return LOCATIONS[name] || null;

}


function calculateDistance(
  name1,
  name2
){

  const a =
    getLocation(name1);

  const b =
    getLocation(name2);

  if(!a || !b){
    return Infinity;
  }

  const dx =
    a[0] - b[0];

  const dy =
    a[1] - b[1];

  const straight =
    Math.sqrt(
      dx * dx +
      dy * dy
    );

  return straight *
    WALKING_FACTOR;

}


/* =========================================================
   徒歩時間
========================================================= */

function walkingMinutes(
  distance
){

  return Math.max(
    1,
    Math.ceil(
      distance /
      WALKING_SPEED
    )
  );

}


/* =========================================================
   徒歩5分以内だけ取得
========================================================= */

function getNearby(
  list,
  selectedName
){

  return list
    .filter(item => {

      const name =
        item[0];

      if(name === selectedName){
        return false;
      }

      const distance =
        calculateDistance(
          selectedName,
          name
        );

      return (
        distance <=
        MAX_WALKING_DISTANCE
      );

    })
    .map(item => {

      const distance =
        calculateDistance(
          selectedName,
          item[0]
        );

      return {
        item:item,
        distance:distance,
        minutes:
          walkingMinutes(distance)
      };

    })
    .sort(
      (a,b) =>
        a.distance -
        b.distance
    );

}

      else if(type === "shop"){

        link =
          `${OFFICIAL}/tdl/shop/detail/${detailId}/`;

      }


      div.innerHTML = `

        ${imageHTML(
          name,
          true,
          type,
          detailId
        )}

        <div class="mini-info">

          <div class="mini-name">
            ${escapeHTML(name)}
          </div>

          <div class="mini-area">
            📍 ${escapeHTML(area)}
          </div>

          <div class="distance">
            🚶 約${result.minutes}分
          </div>

        </div>

      `;


      div.onclick = () => {

        if(link !== "#"){

          window.open(
            link,
            "_blank"
          );

        }

      };


      container.appendChild(
        div
      );

    }
  );


  observeLazyImages();

}


/* =========================================================
   主要画像先読み
========================================================= */

function preloadImportantImages(){

  const preloadNames = [

    "オムニバス",
    "カリブの海賊",
    "シンデレラ",
    "プーさん",
    "美女と野獣",
    "グランドエンポーリアム",
    "ギャグファクトリー／ファイブ・アンド・ダイム"

  ];


  preloadNames.forEach(
    name => {

      const url =
        getKnownImage(name);

      if(!url){
        return;
      }

      const img =
        new Image();

      img.decoding =
        "async";

      img.src =
        url;

    }
  );

}


/* =========================================================
   初期表示
========================================================= */

renderAttractions();


if(
  "requestIdleCallback"
  in window
){

  requestIdleCallback(
    preloadImportantImages
  );

}else{

  setTimeout(
    preloadImportantImages,
    300
  );

}

</script>
