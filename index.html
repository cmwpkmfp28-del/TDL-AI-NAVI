/* =========================================================
   画像キャッシュ
========================================================= */

const IMAGE_CACHE_KEY="tdl_ai_navi_official_images_v2";

let imageCache={};

try{
  imageCache=
    JSON.parse(
      localStorage.getItem(IMAGE_CACHE_KEY)||"{}"
    );
}catch(e){
  imageCache={};
}


/* =========================================================
   公式画像URL取得
   「最初の画像」ではなく「イメージ1」だけ
========================================================= */

async function findOfficialImage(url){

  if(imageCache[url])
    return imageCache[url];

  try{

    const res=
      await fetch(
        "https://r.jina.ai/"+url,
        {cache:"force-cache"}
      );

    if(!res.ok)
      return null;

    const text=await res.text();

    const patterns=[

      /!\[[^\]]*(?:イメージ\s*1|image\s*1)[^\]]*\]\((https:\/\/media1\.tokyodisneyresort\.jp\/[^)\s]+)\)/i,

      /<img[^>]+(?:alt|title)=["'][^"']*(?:イメージ\s*1|image\s*1)[^"']*["'][^>]+src=["'](https:\/\/media1\.tokyodisneyresort\.jp\/[^"']+)["']/i,

      /<img[^>]+src=["'](https:\/\/media1\.tokyodisneyresort\.jp\/[^"']+)["'][^>]+(?:alt|title)=["'][^"']*(?:イメージ\s*1|image\s*1)[^"']*["']/i

    ];

    for(const regex of patterns){

      const match=text.match(regex);

      if(match){

        imageCache[url]=match[1];

        try{
          localStorage.setItem(
            IMAGE_CACHE_KEY,
            JSON.stringify(imageCache)
          );
        }catch(e){}

        return match[1];
      }
    }

  }catch(e){
    console.log("画像取得失敗",url);
  }

  return null;
}


/* =========================================================
   画像を遅延読み込み
========================================================= */

const imageObserver=
  new IntersectionObserver(
    entries=>{

      entries.forEach(entry=>{

        if(!entry.isIntersecting)
          return;

        const img=entry.target;

        imageObserver.unobserve(img);

        loadCardImage(img);

      });

    },
    {
      rootMargin:"350px"
    }
  );


async function loadCardImage(img){

  const url=img.dataset.page;
  const placeholder=img.parentElement.querySelector(".placeholder");

  if(!url)
    return;

  /* キャッシュ済みなら即表示 */

  if(imageCache[url]){

    img.src=imageCache[url];

    img.onload=()=>{
      img.style.display="block";
      placeholder.style.display="none";
    };

    return;
  }

  placeholder.textContent="公式画像を読み込み中…";

  const imageUrl=
    await findOfficialImage(url);

  if(imageUrl){

    img.src=imageUrl;

    img.onload=()=>{
      img.style.display="block";
      placeholder.style.display="none";
    };

    img.onerror=()=>{
      img.style.display="none";
      placeholder.textContent="公式画像を表示できませんでした";
    };

  }else{

    placeholder.textContent=
      "公式画像を取得できませんでした";

  }
}

  const imageBox=document.createElement("div");
  imageBox.className="image-box";

  const img=document.createElement("img");

  img.alt=item.name;
  img.loading="lazy";
  img.style.display="none";

  img.dataset.page=detailUrl(item);

  const placeholder=document.createElement("div");
  placeholder.className="placeholder";
  placeholder.textContent=
    `${item.emoji} 公式画像を読み込みます`;

  imageBox.appendChild(img);
  imageBox.appendChild(placeholder);

  const body=document.createElement("div");
  body.className="body";

  const title=document.createElement("div");
  title.className="title";
  title.textContent=
    `${item.emoji} ${item.name}`;

  const area=document.createElement("div");
  area.className="area";
  area.textContent=item.area;

  const desc=document.createElement("div");
  desc.className="desc";

  if(item.type==="shop")
    desc.textContent="東京ディズニーリゾート公式ショップ";

  else if(item.type==="restaurant")
    desc.textContent="東京ディズニーリゾート公式レストラン";

  else
    desc.textContent="東京ディズニーリゾート公式アトラクション";

  const buttons=document.createElement("div");
  buttons.className="buttons";

  if(selectable){

    const select=document.createElement("button");

    select.className="select";
    select.textContent="ここを選択";

    select.onclick=()=>{
      selectAttraction(item);
    };

    buttons.appendChild(select);
  }

  const official=document.createElement("a");

  official.className="official";
  official.textContent="公式詳細";
  official.href=detailUrl(item);
  official.target="_blank";
  official.rel="noopener";

  buttons.appendChild(official);

  body.appendChild(title);
  body.appendChild(area);
  body.appendChild(desc);
  body.appendChild(buttons);

  card.appendChild(imageBox);
  card.appendChild(body);

  imageObserver.observe(img);

  return card;
}


/* =========================================================
   エリア
========================================================= */

function renderAreas(){

  const box=document.getElementById("areas");
  box.innerHTML="";

  areas.forEach(area=>{

    const btn=document.createElement("button");

    btn.className="area-btn";

    if(area===selectedArea)
      btn.classList.add("active");

    btn.textContent=area;

    btn.onclick=()=>{

      selectedArea=area;

      renderAreas();
      renderAttractions();

      document.getElementById("selected").innerHTML="";
      document.getElementById("nearby").innerHTML="";

    };

    box.appendChild(btn);

  });
}


/* =========================================================
   アトラクション
========================================================= */

function renderAttractions(){

  const box=document.getElementById("attractions");

  box.innerHTML="";

  const keyword=
    document.getElementById("search")
    .value
    .trim()
    .toLowerCase();

  const list=
    attractions.filter(item=>
      item.area===selectedArea &&
      item.name.toLowerCase().includes(keyword)
    );

  if(!list.length){

    box.innerHTML=
      `<div class="empty">該当するアトラクションがありません</div>`;

    return;
  }

  list.forEach(item=>{
    box.appendChild(
      makeCard(item,true)
    );
  });
}


/* =========================================================
   アトラクション選択
========================================================= */

function selectAttraction(item){

  const selected=
    document.getElementById("selected");

  selected.innerHTML=`
    <div class="selected">
      <div class="selected-small">現在選択中</div>
      <div class="selected-name">
        ${item.emoji} ${item.name}
      </div>
      <div class="selected-small">
        ${item.area}
      </div>
    </div>
  `;

  renderNearby(item);

  setTimeout(()=>{
    selected.scrollIntoView({
      behavior:"smooth",
      block:"start"
    });
  },50);
}


/* =========================================================
   周辺施設
========================================================= */

function renderNearby(attraction){

  const box=document.getElementById("nearby");

  box.innerHTML="";

  const nearA=
    attractions.filter(x=>
      x.area===attraction.area &&
      x.id!==attraction.id
    );

  const nearR=
    restaurants.filter(x=>
      x.area===attraction.area
    );

  const nearS=
    shops.filter(x=>
      x.area===attraction.area
    );

  const nearP=
    photos.filter(x=>
      x.area===attraction.area
    );

  addFacilitySection(
    box,
    "🎢 近くのアトラクション",
    nearA
  );

  addFacilitySection(
    box,
    "🍴 近くのレストラン",
    nearR
  );

  addFacilitySection(
    box,
    "🛍️ 近くのショップ",
    nearS
  );

  addPhotoSection(
    box,
    "📸 フォトスポット",
    nearP
  );
}


/* =========================================================
   施設セクション
========================================================= */

function addFacilitySection(box,title,list){

  const section=document.createElement("section");
  section.className="section";

  const heading=document.createElement("div");
  heading.className="section-title";
  heading.textContent=title;

  section.appendChild(heading);

  if(!list.length){

    const empty=document.createElement("div");
    empty.className="empty";
    empty.textContent="このエリアにはありません";

    section.appendChild(empty);

  }else{

    const grid=document.createElement("div");
    grid.className="grid";

    list.forEach(item=>{
      grid.appendChild(
        makeCard(item,false)
      );
    });

    section.appendChild(grid);
  }

  box.appendChild(section);
}


/* =========================================================
   フォトスポット
========================================================= */

function addPhotoSection(box,title,list){

  const section=document.createElement("section");
  section.className="section";

  const heading=document.createElement("div");
  heading.className="section-title";
  heading.textContent=title;

  section.appendChild(heading);

  if(!list.length){

    const empty=document.createElement("div");
    empty.className="empty";
    empty.textContent="このエリアにはありません";

    section.appendChild(empty);

  }else{

    const grid=document.createElement("div");
    grid.className="grid";

    list.forEach(item=>{

      const card=document.createElement("div");
      card.className="photo";

      const image=document.createElement("div");
      image.className="image-box";

      image.innerHTML=`
        <div class="placeholder">
          ${item.emoji}<br>
          フォトスポット
        </div>
      `;

      const body=document.createElement("div");
      body.className="photo-body";

      body.innerHTML=`
        <div class="title">
          ${item.emoji} ${item.name}
        </div>

        <div class="area">
          ${item.area}
        </div>

        <div class="desc">
          ${item.desc}
        </div>

        <div class="source">
          出典：${item.source}
        </div>
      `;

      card.appendChild(image);
      card.appendChild(body);

      grid.appendChild(card);

    });

    section.appendChild(grid);
  }

  box.appendChild(section);
}


/* =========================================================
   検索
========================================================= */

document
  .getElementById("search")
  .addEventListener(
    "input",
    renderAttractions
  );


/* =========================================================
   起動
========================================================= */

renderAreas();
renderAttractions();

</script>

</body>
</html>
