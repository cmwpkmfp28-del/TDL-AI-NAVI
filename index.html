<style>

/* =========================
   基本
========================= */

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Helvetica Neue",
    Arial,
    sans-serif;

  background:#f5f6f8;
  color:#222;
}


/* =========================
   ヘッダー
========================= */

header{

  background:
    linear-gradient(
      135deg,
      #111827,
      #374151
    );

  color:white;

  padding:
    26px
    18px
    24px;
}

header h1{

  margin:0;

  font-size:27px;

  letter-spacing:.3px;
}

header p{

  margin:
    7px
    0
    0;

  font-size:13px;

  opacity:.8;
}


/* =========================
   メイン
========================= */

.container{

  max-width:900px;

  margin:
    0
    auto;

  padding:18px;
}


/* =========================
   選択エリア
========================= */

.selector{

  background:white;

  border-radius:20px;

  padding:18px;

  box-shadow:
    0 5px 20px
    rgba(0,0,0,.06);

  margin-bottom:18px;
}

.step{

  font-size:12px;

  color:#888;

  font-weight:bold;

  margin-bottom:6px;
}

.selector-title{

  font-size:18px;

  font-weight:bold;

  margin-bottom:14px;
}


/* =========================
   エリアボタン
========================= */

.area-buttons{

  display:grid;

  grid-template-columns:
    repeat(2,1fr);

  gap:8px;

  margin-bottom:15px;
}

.area-button{

  border:
    1px solid
    #ddd;

  background:#fff;

  border-radius:12px;

  padding:12px 8px;

  font-size:13px;

  font-weight:bold;

  cursor:pointer;

  transition:.15s;
}

.area-button.active{

  background:#111827;

  color:white;

  border-color:#111827;
}


/* =========================
   検索
========================= */

.search-box{

  position:relative;

  margin-top:10px;
}

.search-box input{

  width:100%;

  padding:
    14px
    15px
    14px
    42px;

  border:
    1px solid
    #ddd;

  border-radius:12px;

  font-size:15px;

  outline:none;
}

.search-icon{

  position:absolute;

  left:15px;

  top:13px;

  font-size:18px;
}


/* =========================
   アトラクション一覧
========================= */

.attraction-list{

  display:grid;

  gap:10px;

  margin-top:15px;
}

.attraction-item{

  background:#fff;

  border-radius:15px;

  padding:14px;

  box-shadow:
    0 3px 12px
    rgba(0,0,0,.05);

  cursor:pointer;

  border:
    2px solid
    transparent;

  transition:.15s;
}

.attraction-item:hover{

  border-color:#d1d5db;
}

.attraction-name{

  font-size:15px;

  font-weight:bold;

  line-height:1.4;
}

.attraction-area{

  font-size:11px;

  color:#888;

  margin-top:4px;
}

.status{

  display:inline-block;

  margin-top:7px;

  padding:
    4px
    7px;

  border-radius:7px;

  background:#fff0f0;

  color:#c0392b;

  font-size:10px;

  font-weight:bold;
}


/* =========================
   選択後
========================= */

.selected{

  background:white;

  border-radius:18px;

  padding:17px;

  margin-bottom:20px;

  box-shadow:
    0 4px 16px
    rgba(0,0,0,.05);
}

.selected-label{

  font-size:11px;

  color:#888;
}

.selected-name{

  font-size:20px;

  font-weight:bold;

  margin-top:4px;
}

.selected-area{

  color:#777;

  font-size:12px;

  margin-top:4px;
}

.detail-button{

  display:block;

  text-decoration:none;

  text-align:center;

  background:#111827;

  color:white;

  padding:11px;

  border-radius:10px;

  margin-top:13px;

  font-size:13px;

  font-weight:bold;

/* =========================
   カテゴリー
========================= */

.category{

  margin-top:25px;
}

.category-title{

  font-size:19px;

  font-weight:bold;

  margin-bottom:11px;
}

.category-sub{

  color:#888;

  font-size:11px;

  margin-top:-6px;

  margin-bottom:10px;
}


/* =========================
   カード
========================= */

.cards{

  display:grid;

  grid-template-columns:
    repeat(2,1fr);

  gap:11px;
}

.card{

  background:white;

  border-radius:15px;

  padding:14px;

  box-shadow:
    0 3px 14px
    rgba(0,0,0,.05);

  display:flex;

  flex-direction:column;
}

.card-icon{

  font-size:24px;

  margin-bottom:7px;
}

.card h3{

  font-size:15px;

  margin:
    0
    0
    4px;

  line-height:1.4;
}

.card-area{

  font-size:10px;

  color:#888;

  margin-bottom:6px;
}

.card p{

  font-size:11px;

  color:#777;

  line-height:1.5;

  margin:
    0
    0
    10px;

  flex:1;
}

.card a{

  display:block;

  text-align:center;

  background:#111827;

  color:white;

  text-decoration:none;

  padding:9px;

  border-radius:9px;

  font-size:11px;

  font-weight:bold;

/* =========================
   空表示
========================= */

.empty{

  font-size:12px;

/* =========================
   注意
========================= */

.note{

/* =========================
   スマホ
========================= */

@media(max-width:600px){

    grid-template-columns:
      repeat(2,1fr);
  }

    font-size:24px;
  }

</style>

  button.className =
    "area-button";

  button.textContent =
    area;

  button.onclick = () => {

    document
      .querySelectorAll(".area-button")
      .forEach(b =>
        b.classList.remove("active")
      );

    button.classList.add("active");

    selectedArea = area;

    document
      .getElementById("searchInput")
      .value = "";

    renderAttractions();

  };

  areaButtons.appendChild(button);

});


/* =====================================================
   選択中のエリア
===================================================== */

let selectedArea = "";


/* =====================================================
   アトラクション表示
===================================================== */

function renderAttractions(){

  const list =
    document.getElementById(
      "attractionList"
    );

  const keyword =
    document
      .getElementById("searchInput")
      .value
      .trim()
      .toLowerCase();


  let filtered =
    attractions;


  if(selectedArea){

    filtered =
      filtered.filter(
        a => a.area === selectedArea
      );

  }


  if(keyword){

    filtered =
      filtered.filter(
        a =>
          a.name
            .toLowerCase()
            .includes(keyword)
      );

  }


  if(filtered.length === 0){

    list.innerHTML = `
      <div class="empty">
        該当するアトラクションがありません
      </div>
    `;

    return;

  }


  list.innerHTML =
    filtered
      .map(a => `

        <div
          class="attraction-item"
          onclick="selectAttraction('${a.name}')">

          <div class="attraction-name">
            🎢 ${a.name}
          </div>

          <div class="attraction-area">
            ${a.area}
          </div>

          ${
            a.status
            ?
            `<div class="status">
              ${a.status}
            </div>`
            :
            ""
          }

        </div>

      `)
      .join("");

}


/* =====================================================
   検索
===================================================== */

document
  .getElementById("searchInput")
  .addEventListener(
    "input",
    renderAttractions
  );


/* =====================================================
   アトラクション選択
===================================================== */

function selectAttraction(name){

  const selected =
    attractions.find(
      a => a.name === name
    );

  if(!selected){
    return;
  }


  /* 周辺アトラクション */

  const nearbyAttractions =
    attractions.filter(
      a =>
        a.area === selected.area &&
        a.name !== selected.name
    );


  /* 周辺レストラン */

  const nearbyRestaurants =
    restaurants.filter(
      r =>
        r.area === selected.area
    );


  /* 周辺ショップ */

  const nearbyShops =
    shops.filter(
      s =>
        s.area === selected.area
    );


  /* 周辺フォト */

  const nearbyPhotos =
    photos.filter(
      p =>
        p.area === selected.area ||
        p.area === "全エリア" ||
        (
          selected.area === "ワールドバザール" &&
          p.name === "シンデレラ城"
        )
    );


  /* =========================
     結果表示
  ========================= */

  const result =
    document.getElementById(
      "result"
    );


  result.innerHTML = `


  <!-- 選択中 -->

  <div class="selected">

    <div class="selected-label">
      SELECTED ATTRACTION
    </div>

    <div class="selected-name">
      🎢 ${selected.name}
    </div>

    <div class="selected-area">
      ${selected.area}
    </div>


    ${
      selected.status
      ?
      `
      <div class="status">
        ${selected.status}
      </div>
      `
      :
      ""
    }


    <a
      class="detail-button"
      href="${selected.url}"
      target="_blank"
      rel="noopener">

      公式サイトで詳しく見る ↗

    </a>

  </div>



  <!-- アトラクション -->

  <section class="category">

    <div class="category-title">
      🎢 周辺アトラクション
    </div>

    <div class="category-sub">
      ${selected.area}のアトラクション
    </div>


    <div class="cards">

      ${
        nearbyAttractions.length

        ?

        nearbyAttractions
          .map(a => `

            <div class="card">

              <div class="card-icon">
                🎢
              </div>

              <h3>
                ${a.name}
              </h3>

              <div class="card-area">
                ${a.area}
              </div>

              ${
                a.status
                ?
                `
                <div class="status">
                  ${a.status}
                </div>
                `
                :
                ""
              }

              <p>
                ${a.status || "同じエリアのアトラクション"}
              </p>

              <a
                href="${a.url}"
                target="_blank"
                rel="noopener">

                公式詳細を見る ↗

              </a>

            </div>

          `)
          .join("")

        :

        `
        <div class="empty">
          このエリアには他のアトラクションがありません
        </div>
        `
      }

    </div>

  </section>



  <!-- ショップ -->

  <section class="category">

    <div class="category-title">
      🛍️ 周辺ショップ
    </div>

    <div class="category-sub">
      グッズ・ショッピング
    </div>


    <div class="cards">

      ${
        nearbyShops.length

        ?

        nearbyShops
          .map(s => `

            <div class="card">

              <div class="card-icon">
                🛍️
              </div>

              <h3>
                ${s.name}
              </h3>

              <div class="card-area">
                ${s.area}
              </div>

              <p>
                ${s.description}
              </p>

              <a
                href="${s.url}"
                target="_blank"
                rel="noopener">

                ショップ詳細を見る ↗

              </a>

            </div>

          `)
          .join("")

        :

        `
        <div class="empty">
          このエリアのショップ情報を準備中
        </div>
        `
      }

    </div>

  </section>



  <!-- フード -->

  <section class="category">

    <div class="category-title">
      🍴 周辺フード
    </div>

    <div class="category-sub">
      レストラン・軽食
    </div>


    <div class="cards">

      ${
        nearbyRestaurants.length

        ?

        nearbyRestaurants
          .map(r => `

            <div class="card">

              <div class="card-icon">
                🍴
              </div>

              <h3>
                ${r.name}
              </h3>

              <div class="card-area">
                ${r.area}
              </div>

              <p>
                ${r.description}
              </p>

              <a
                href="${r.url}"
                target="_blank"
                rel="noopener">

                レストラン詳細を見る ↗

              </a>

            </div>

          `)
          .join("")

        :

        `
        <div class="empty">
          このエリアのレストラン情報を準備中
        </div>
        `
      }

    </div>

  </section>



  <!-- フォト -->

  <section class="category">

    <div class="category-title">
      📸 フォトスポット
    </div>

    <div class="category-sub">
      周辺で撮影できそうな場所
    </div>


    <div class="cards">

      ${
        nearbyPhotos
          .map(p => `

            <div class="card">

              <div class="card-icon">
                📸
              </div>

              <h3>
                ${p.name}
              </h3>

              <div class="card-area">
                ${p.area}
              </div>

              <p>
                ${p.description}
              </p>

              <a
                href="${p.url}"
                target="_blank"
                rel="noopener">

                公式撮影情報 ↗

              </a>

            </div>

          `)
          .join("")
      }

    </div>

  </section>


  <div class="note">

    ※このアプリの施設情報は東京ディズニーリゾート公式サイトを
    もとに整理しています。営業時間、休止、販売状況などは
    当日の公式サイト・東京ディズニーリゾート・アプリで確認してください。

  </div>

  `;


  /* 結果までスクロール */

  setTimeout(() => {

    result.scrollIntoView({
      behavior:"smooth",
      block:"start"
    });

  },100);

}


/* =====================================================
   初期表示
===================================================== */

renderAttractions();


</script>


</body>

</html>
