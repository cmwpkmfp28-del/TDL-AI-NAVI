<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",
    "Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
  background:#f5f7fb;
  color:#222;
}

header{
  position:sticky;
  top:0;
  z-index:100;
  background:#111827;
  color:white;
  padding:14px 16px;
  box-shadow:0 2px 8px rgba(0,0,0,.15);
}

header h1{
  margin:0;
  font-size:20px;
}

header p{
  margin:4px 0 0;
  font-size:12px;
  opacity:.75;
}

main{
  max-width:1100px;
  margin:auto;
  padding:18px 14px 60px;
}

h2{
  margin:22px 0 10px;
  font-size:18px;
}

.notice{
  background:#fff;
  border-radius:14px;
  padding:12px 14px;
  margin-bottom:14px;
  font-size:13px;
  line-height:1.6;
  box-shadow:0 2px 8px rgba(0,0,0,.06);
}

.area-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px;
}

.area-btn{
  border:0;
  border-radius:12px;
  background:white;
  padding:14px 8px;
  font-size:14px;
  font-weight:bold;
  box-shadow:0 2px 7px rgba(0,0,0,.08);
  cursor:pointer;
}

.area-btn.active{
  background:#111827;
  color:white;
}

.search{
  width:100%;
  border:0;
  border-radius:12px;
  padding:13px 14px;
  margin:14px 0;
  font-size:15px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px;
}

.card{
  background:white;
  border-radius:14px;
  overflow:hidden;
  box-shadow:0 2px 8px rgba(0,0,0,.07);
}

.card-image{
  width:100%;
  aspect-ratio:16/9;
  background:linear-gradient(135deg,#dbeafe,#f5f3ff);
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  position:relative;
}

.card-image img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.image-placeholder{
  font-size:35px;
  opacity:.55;
}

.card-body{
  padding:11px;
}

.card-title{
  font-size:14px;
  font-weight:bold;
  line-height:1.4;
}

.card-desc{
  font-size:12px;
  color:#666;
  line-height:1.55;
  margin-top:5px;
}

.tags{
  display:flex;
  flex-wrap:wrap;
  gap:4px;
  margin-top:7px;
}

.tag{
  display:inline-block;
  padding:3px 7px;
  border-radius:999px;
  background:#eef2ff;
  color:#3730a3;
  font-size:10px;
}

.tag.warn{
  background:#fff1f2;
  color:#be123c;
}

.tag.green{
  background:#ecfdf5;
  color:#047857;
}

.detail-btn{
  display:block;
  text-align:center;
  text-decoration:none;
  background:#111827;
  color:white;
  border-radius:9px;
  padding:9px 7px;
  margin-top:9px;
  font-size:12px;
  font-weight:bold;
}

.detail-btn.sub{
  background:#eef2ff;
  color:#3730a3;
}

.selected{
  background:white;
  border-radius:15px;
  padding:14px;
  margin:14px 0;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.selected strong{
  font-size:16px;
}

.section{
  margin-top:24px;
}

.section-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:10px;
}

.section-title h2{
  margin:0;
}

.count{
  font-size:11px;
  color:#777;
}

.empty{
  background:white;
  padding:18px;
  border-radius:12px;
  color:#777;
  font-size:13px;
  text-align:center;
}

.small-note{
  color:#777;
  font-size:11px;
  margin-top:7px;
  line-height:1.5;
}

.source{
  font-size:10px;
  color:#888;
  margin-top:7px;
}

@media(min-width:700px){
  .area-grid{
    grid-template-columns:repeat(4,1fr);
  }

  .grid{
    grid-template-columns:repeat(3,minmax(0,1fr));
  }
}
</style>
</head>

/* =========================================================
   公式URL
========================================================= */

function attractionURL(id){
  return `https://www.tokyodisneyresort.jp/tdl/attraction/detail/${id}/`;
}

function shopURL(id){
  return `https://www.tokyodisneyresort.jp/tdl/shop/detail/${id}/`;
}

function restaurantURL(id){
  return `https://www.tokyodisneyresort.jp/tdl/restaurant/detail/${id}/`;
}


/* =========================================================
   エリア表示
========================================================= */

function renderAreas(){

  const grid=document.getElementById("areaGrid");

  grid.innerHTML=areas.map(([name,emoji])=>`
    <button
      class="area-btn ${selectedArea===name ? "active":""}"
      onclick="selectArea('${name}')"
    >
      ${emoji} ${name}
    </button>
  `).join("");
}


function selectArea(area){

  selectedArea=area;
  selectedAttraction=null;

  renderAreas();
  renderAttractions();

  document.getElementById("selectedBox").innerHTML="";
  document.getElementById("nearby").innerHTML="";
}


/* =========================================================
   アトラクション表示
========================================================= */

function renderAttractions(){

  const grid=document.getElementById("attractionGrid");
  const keyword=document.getElementById("search").value.trim().toLowerCase();

  let data=attractions;

  if(selectedArea){
    data=data.filter(x=>x.area===selectedArea);
  }

  if(keyword){
    data=data.filter(x=>
      x.name.toLowerCase().includes(keyword) ||
      x.area.toLowerCase().includes(keyword)
    );
  }

  if(!data.length){
    grid.innerHTML=`<div class="empty">該当するアトラクションがありません。</div>`;
    return;
  }

  grid.innerHTML=data.map(a=>{

    const imagePage=attractionURL(a.id);

    return `
      <div class="card">

        <div
          class="card-image official-image"
          data-image-page="${imagePage}"
        >
          <div class="image-placeholder">${a.emoji}</div>
        </div>

        <div class="card-body">

          <div class="card-title">
            ${a.name}
          </div>

          <div class="card-desc">
            ${a.desc}
          </div>

          ${a.status ? `
            <div class="tags">
              <span class="tag warn">⚠️ ${a.status}</span>
            </div>
          `:""}

          <button
            class="detail-btn"
            onclick="selectAttraction('${a.name}')"
          >
            この周辺を見る
          </button>

          <a
            class="detail-btn sub"
            href="${imagePage}"
            target="_blank"
            rel="noopener noreferrer"
            referrerpolicy="no-referrer"
          >
            公式ページ
          </a>

        </div>
      </div>
    `;

  }).join("");

  loadOfficialImages();
}


/* =========================================================
   アトラクション選択
========================================================= */

function selectAttraction(name){

  selectedAttraction=attractions.find(x=>x.name===name);

  if(!selectedAttraction) return;

  selectedArea=selectedAttraction.area;

  renderAreas();
  renderAttractions();

  document.getElementById("selectedBox").innerHTML=`
    <div class="selected">

      <div>
        🎯 選択中のアトラクション
      </div>

      <strong>
        ${selectedAttraction.emoji}
        ${selectedAttraction.name}
      </strong>

      <div class="small-note">
        ${selectedAttraction.desc}
      </div>

    </div>
  `;

  renderNearby();

  window.scrollTo({
    top:document.getElementById("selectedBox").offsetTop-80,
    behavior:"smooth"
  });
}


/* =========================================================
   周辺情報
========================================================= */

function renderNearby(){

  if(!selectedAttraction) return;

  const area=selectedAttraction.area;

  const nearbyAttractions=
    attractions.filter(x=>
      x.area===area &&
      x.name!==selectedAttraction.name
    );

  const nearbyRestaurants=
    restaurants.filter(x=>x.area===area);

  const nearbyShops=
    shops.filter(x=>x.area===area);

  const nearbyPhotos=
    photoSpots.filter(x=>x.area===area);

  document.getElementById("nearby").innerHTML=`

    <div class="section">

      <div class="section-title">
        <h2>🎢 近くのアトラクション</h2>
        <span class="count">${nearbyAttractions.length}件</span>
      </div>

      <div class="grid">
        ${
          nearbyAttractions.length
          ? nearbyAttractions.map(a=>attractionCard(a)).join("")
          : `<div class="empty">ありません</div>`
        }
      </div>

    </div>


    <div class="section">

      <div class="section-title">
        <h2>🍴 近くのレストラン</h2>
        <span class="count">${nearbyRestaurants.length}件</span>
      </div>

      <div class="grid">
        ${
          nearbyRestaurants.length
          ? nearbyRestaurants.map(r=>restaurantCard(r)).join("")
          : `<div class="empty">ありません</div>`
        }
      </div>

    </div>


    <div class="section">

      <div class="section-title">
        <h2>🛍️ 近くのショップ</h2>
        <span class="count">${nearbyShops.length}件</span>
      </div>

      <div class="grid">
        ${
          nearbyShops.length
          ? nearbyShops.map(s=>shopCard(s)).join("")
          : `<div class="empty">ありません</div>`
        }
      </div>

    </div>


    <div class="section">

      <div class="section-title">
        <h2>📸 フォトスポット</h2>
        <span class="count">${nearbyPhotos.length}件</span>
      </div>

      <div class="grid">
        ${
          nearbyPhotos.length
          ? nearbyPhotos.map(p=>photoCard(p)).join("")
          : `<div class="empty">このエリアの登録スポットはありません。</div>`
        }
      </div>

    </div>

  `;

  loadOfficialImages();
}


/* =========================================================

========================================================= */

function attractionCard(a){

  const url=attractionURL(a.id);

  return `
    <div class="card">

      <div
        class="card-image official-image"
        data-image-page="${url}"
      >
        <div class="image-placeholder">${a.emoji}</div>
      </div>

      <div class="card-body">

        <div class="card-title">
          ${a.emoji} ${a.name}
        </div>

        <div class="card-desc">
          ${a.desc}
        </div>

        ${a.status ? `
          <div class="tags">
            <span class="tag warn">⚠️ ${a.status}</span>
          </div>
        `:""}

        <button
          class="detail-btn"
          onclick="selectAttraction('${a.name}')"
        >
          この周辺を見る
        </button>

        <a
          class="detail-btn sub"
          href="${url}"
          target="_blank"
          rel="noopener noreferrer"
          referrerpolicy="no-referrer"
        >
          公式ページ
        </a>

      </div>
    </div>
  `;
}


function shopCard(s){

  const url=shopURL(s.id);

  return `
    <div class="card">

      <div
        class="card-image official-image"
        data-image-page="${url}"

        <div class="image-placeholder">${s.emoji}</div>

        <div class="card-title">
          ${s.emoji} ${s.name}
        </div>

        <div class="card-desc">
          ${s.desc}
        </div>

        <div class="tags">

          ${(s.tags||[]).map(tag=>`
            <span class="tag">${tag}</span>

          ${s.status ? `
            <span class="tag warn">

}

   公式ページから画像を取得
   ※現在動いている画像取得方式を維持
========================================================= */

async function getOfficialImage(pageUrl){

  try{

    const proxy=
      "https://r.jina.ai/" +
      pageUrl;

    const controller=new AbortController();

    const timeout=setTimeout(
      ()=>controller.abort(),
      12000
    );

    const response=await fetch(
      proxy,
      {
        signal:controller.signal
      }
    );

    clearTimeout(timeout);

    if(!response.ok) return null;

    const text=await response.text();

    /*
      まず公式メインビジュアルを探す
    */

    let match=text.match(
      /(https:\/\/media1\.tokyodisneyresort\.jp\/[^)\s"'<>]+_main_visual_name_1\.(?:jpg|jpeg|png)(?:\?[^)\s"'<>]*)?)/i
    );

    if(match){
      return match[1];
    }

    /*
      メインビジュアルが取れなかった場合、
      media1の画像から探す
    */

    const images=[
      ...text.matchAll(
        /(https:\/\/media1\.tokyodisneyresort\.jp\/[^)\s"'<>]+\.(?:jpg|jpeg|png)(?:\?[^)\s"'<>]*)?)/gi
      )
    ];

    if(images.length){
      return images[0][1];
    }

  }catch(error){

    console.log(
      "公式画像取得失敗:",
      pageUrl
    );

  }

  return null;
}


async function loadOfficialImages(){

  const elements=[
    ...document.querySelectorAll(".official-image")
  ];

  /*
    同じページを何度も取りに行かない
  */

  const unique=[];

  elements.forEach(el=>{

    const page=el.dataset.imagePage;

    if(
      page &&
      !unique.some(x=>x.page===page)
    ){
      unique.push({
        page,
        elements:[el]
      });
    }else{

      const item=unique.find(
        x=>x.page===page
      );

      if(item){
        item.elements.push(el);
      }

    }

  });


  /*
    最大4件ずつ読み込む
  */

  for(
    let i=0;
    i<unique.length;
    i+=4
  ){

    const batch=unique.slice(i,i+4);

    await Promise.all(
      batch.map(async item=>{

        const cacheKey=
          "tdl_img_" +
          btoa(
            encodeURIComponent(item.page)
          ).slice(0,80);

        let image=
          sessionStorage.getItem(cacheKey);

        if(!image){

          image=
            await getOfficialImage(
              item.page
            );

          if(image){

            try{
              sessionStorage.setItem(
                cacheKey,
                image
              );
            }catch(e){}

          }

        }

        if(!image) return;

        item.elements.forEach(el=>{

          if(el.querySelector("img")) return;

          const img=
            document.createElement("img");

          img.src=image;
          img.alt="公式画像";
          img.loading="lazy";

          img.onerror=()=>{
            img.remove();
          };

          el.appendChild(img);

        });

      })
    );

  }

}
