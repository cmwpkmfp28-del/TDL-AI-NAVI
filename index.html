<html lang="ja">

<title>🏰 TDL AI NAVI</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
  background:#f6f7fb;
  color:#222;
}

header{
  position:sticky;
  top:0;
  z-index:100;
  background:rgba(255,255,255,.96);
  backdrop-filter:blur(10px);
  border-bottom:1px solid #ddd;
  padding:14px 16px;
}

header h1{
  margin:0;
  font-size:20px;
}

header p{
  margin:4px 0 0;
  color:#777;
  font-size:12px;
}

.container{
  max-width:900px;
  margin:auto;
  padding:16px;
}

.section{
  margin-bottom:22px;
}

.section-title{
  font-size:18px;
  font-weight:bold;
  margin-bottom:10px;
}

.area-buttons{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px;
}

.area-btn{
  border:0;
  background:white;
  padding:12px 8px;
  border-radius:12px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
  font-size:14px;
  cursor:pointer;
}

.area-btn.active{
  background:#222;
  color:white;
}

.search{
  width:100%;
  padding:13px 14px;
  border:1px solid #ddd;
  border-radius:12px;
  font-size:16px;
  background:white;
}

.cards{
  display:grid;
  gap:10px;
}

.card{
  background:white;
  border-radius:14px;
  overflow:hidden;
  box-shadow:0 2px 9px rgba(0,0,0,.07);
  cursor:pointer;
}

.card-main{
  display:flex;
  align-items:center;
  min-height:88px;
}

.card-image{
  width:105px;
  height:88px;
  flex:none;
  object-fit:cover;
  background:#eee;
}

.card-image.placeholder{
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:30px;
}

.card-info{
  padding:10px 12px;
}

.card-title{
  font-weight:bold;
  font-size:15px;
}

.card-area{
  margin-top:5px;
  color:#888;
  font-size:12px;
}

.selected{
  background:#222;
  color:white;
  border-radius:15px;
  padding:15px;
  margin-bottom:18px;
}

.selected-title{
  font-size:18px;
  font-weight:bold;
}

.selected-area{
  color:#bbb;
  font-size:12px;
  margin-top:3px;
}

.selected-link{
  display:inline-block;
  margin-top:10px;
  color:white;
  font-size:12px;
}

.category{
  margin-top:18px;
}

.category-title{
  font-weight:bold;
  margin-bottom:8px;
}

.mini-card{
  display:flex;
  background:white;
  border-radius:12px;
  margin-bottom:8px;
  overflow:hidden;
  box-shadow:0 2px 7px rgba(0,0,0,.06);
}

.mini-image{
  width:90px;
  height:75px;
  object-fit:cover;
  background:#eee;
  flex:none;
}

.mini-image.placeholder{
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:24px;
}

.mini-info{
  padding:10px;
}

.mini-name{
  font-size:14px;
  font-weight:bold;
}

.mini-area{
  color:#888;
  font-size:11px;
  margin-top:3px;
}

.photo-card{
  background:white;
  border-radius:13px;
  padding:13px;
  margin-bottom:9px;
  box-shadow:0 2px 7px rgba(0,0,0,.06);
}

.photo-icon{
  font-size:30px;
}

.photo-title{
  font-weight:bold;
  margin-top:5px;
}

.photo-description{
  color:#666;
  font-size:12px;
  margin-top:4px;
  line-height:1.5;
}

.photo-source{
  font-size:11px;
  margin-top:8px;
}

.photo-source a{
  color:#2878d8;
}

.hidden{
  display:none;
}

.count{
  color:#888;
  font-size:12px;
  margin:8px 0;
}

.loading{
  color:#999;
  font-size:12px;
  padding:10px 0;
}

.image-loading{
  position:relative;
}

.image-loading::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(
    90deg,
    #eee 25%,
    #f7f7f7 50%,
    #eee 75%
  );
  background-size:200% 100%;
  animation:imageShimmer 1.2s infinite;
}

@keyframes imageShimmer{
  from{
    background-position:200% 0;
  }
  to{
    background-position:-200% 0;
  }
}

@media(min-width:700px){
  .area-buttons{
    grid-template-columns:repeat(4,1fr);
  }

  .cards{
    grid-template-columns:repeat(2,1fr);
  }
}

/* =========================================================
   画像キャッシュ
========================================================= */

const IMAGE_CACHE_KEY =
  "tdl_ai_navi_image_cache_v3";

let imageCache = {};

try{
  imageCache =
    JSON.parse(
      localStorage.getItem(IMAGE_CACHE_KEY) || "{}"
    );
}catch(e){
  imageCache = {};
}


/* =========================================================
   画像キャッシュ保存
========================================================= */

function saveImageCache(){

  try{
    localStorage.setItem(
      IMAGE_CACHE_KEY,
      JSON.stringify(imageCache)
    );
  }catch(e){}

}


/* =========================================================
   キャッシュキー
========================================================= */

function imageKey(name){

  return String(name);

}


/* =========================================================
   直接画像 or キャッシュ画像
========================================================= */

function getKnownImage(name){

  const key = imageKey(name);

  if(imageCache[key]){
    return imageCache[key];
  }

  if(DIRECT_IMAGES[name]){
    return DIRECT_IMAGES[name];
  }

  return null;

}


/* =========================================================
   公式ページURL
========================================================= */

function getDetailURL(type,id){

  if(type === "attraction"){
    return `${OFFICIAL}/tdl/attraction/detail/${id}/`;
  }

  if(type === "restaurant"){
    return `${OFFICIAL}/tdl/restaurant/detail/${id}/`;
  }

  if(type === "shop"){
    return `${OFFICIAL}/tdl/shop/detail/${id}/`;
  }

  return null;

}


/* =========================================================
   Jinaから公式「イメージ1」を探す
   ※直接画像がない施設だけ使用
========================================================= */

async function fetchOfficialImage(name,type,id){

  const key = imageKey(name);

  const known =
    getKnownImage(name);

  if(known){
    return known;
  }

  const pageURL =
    getDetailURL(type,id);

  if(!pageURL){
    return null;
  }

  try{

    const response =
      await fetch(
        "https://r.jina.ai/" + pageURL,
        {
          cache:"force-cache"
        }
      );

    if(!response.ok){
      return null;
    }

    const text =
      await response.text();


    /* -----------------------------------------
       Jina Markdown形式
    ----------------------------------------- */

    let match =
      text.match(
        /\[Image:\s*[^\]]*?イメージ\s*1[^\]]*\]\((https:\/\/media1\.tokyodisneyresort\.jp\/[^)\s]+)\)/i
      );

    if(!match){

      match =
        text.match(
          /!\[[^\]]*?イメージ\s*1[^\]]*\]\((https:\/\/media1\.tokyodisneyresort\.jp\/[^)\s]+)\)/i
        );

    }


    /* -----------------------------------------
       Image: ... (URL)
    ----------------------------------------- */

    if(!match){

      match =
        text.match(
          /Image:\s*[^\n]*?イメージ\s*1[^\n]*?\((https:\/\/media1\.tokyodisneyresort\.jp\/[^)\s]+)\)/i
        );

    }


    /* -----------------------------------------
       HTMLっぽい形式
    ----------------------------------------- */

    if(!match){

      match =
        text.match(
          /(?:alt|title)=["'][^"']*?イメージ\s*1[^"']*["'][^>]*?src=["'](https:\/\/media1\.tokyodisneyresort\.jp\/[^"']+)["']/i
        );

    }


    if(!match){

      match =
        text.match(
          /src=["'](https:\/\/media1\.tokyodisneyresort\.jp\/[^"']+)["'][^>]*(?:alt|title)=["'][^"']*?イメージ\s*1/i
        );

    }


    if(!match){
      return null;
    }


    const imageURL =
      match[1]
        .replace(/&amp;/g,"&")
        .replace(/\\u0026/g,"&");


    if(
      !imageURL.includes(
        "media1.tokyodisneyresort.jp"
      )
    ){
      return null;
    }


    imageCache[key] = imageURL;

    saveImageCache();

    return imageURL;

  }catch(error){

    console.log(
      "画像取得失敗:",
      name,
      error
    );

    return null;

  }

}


/* =========================================================
   画像を実際に読み込む
========================================================= */

const imageObserver =
  new IntersectionObserver(
    entries => {

      entries.forEach(entry => {

        if(!entry.isIntersecting){
          return;
        }

        const element =
          entry.target;

        imageObserver.unobserve(element);

        loadLazyImage(element);

      });

    },
    {
      rootMargin:"500px 0px"
    }
  );


/* =========================================================
   lazy画像
========================================================= */

async function loadLazyImage(element){

  if(
    element.dataset.loaded === "true" ||
    element.dataset.loading === "true"
  ){
    return;
  }

  element.dataset.loading = "true";

  const name =
    element.dataset.name;

  const type =
    element.dataset.type;

  const id =
    element.dataset.id;


  /* まずキャッシュ・直接URL */

  let url =
    getKnownImage(name);


  /* なければJina */

  if(!url){

    url =
      await fetchOfficialImage(
        name,
        type,
        id
      );

  }


  /* 画像取得成功 */

  if(url){

    const img =
      document.createElement("img");

    img.className =
      element.dataset.small === "true"
        ? "mini-image"
        : "card-image";

    img.alt = name;

    img.loading = "lazy";

    img.decoding = "async";

    img.referrerPolicy =
      "no-referrer";

    img.src = url;

    img.dataset.fallbackTried =
      element.dataset.fallbackTried || "false";


    img.onload = () => {

      element.replaceWith(img);

    };


    img.onerror = async () => {

      /* 直接URLが壊れていた場合だけ
         キャッシュを削除してJinaを再試行 */

      if(
        img.dataset.fallbackTried === "false" &&
        !DIRECT_IMAGES[name]
      ){

        delete imageCache[
          imageKey(name)
        ];

        saveImageCache();

        element.dataset.loading =
          "false";

        element.dataset.fallbackTried =
          "true";

        await loadLazyImage(element);

      }else{

        element.classList.remove(
          "image-loading"
        );

      }

    };


    return;

  }


  /* 見つからなかった場合 */

  element.dataset.loading =
    "false";

  element.classList.remove(
    "image-loading"
  );

}


/* =========================================================
   画像HTML
========================================================= */

function imageHTML(
  name,
  small=false,
  type="attraction",
  id=""
){

  const url =
    getKnownImage(name);


  /* -----------------------------------------
     すでにURLが分かっている画像
     → 直接読み込む
  ----------------------------------------- */

  if(url){

    return `
      <img
        class="${small ? "mini-image" : "card-image"}"
        src="${url}"
        alt="${escapeHTML(name)}"
        loading="lazy"
        decoding="async"
        fetchpriority="${small ? "low" : "auto"}"
        referrerpolicy="no-referrer"
      >
    `;

  }


  /* -----------------------------------------
     URL不明
     → 画面に近づいた時だけJina取得
  ----------------------------------------- */

  return `
    <div
      class="${small ? "mini-image" : "card-image"} placeholder image-loading lazy-image"
      data-name="${escapeHTML(name)}"
      data-type="${escapeHTML(type)}"
      data-id="${escapeHTML(id)}"
      data-small="${small ? "true" : "false"}"
      data-fallback-tried="false"
    >
      ${small ? "📍" : "🎢"}
    </div>
  `;

}


/* =========================================================
   lazy画像を監視対象へ追加
========================================================= */

function observeLazyImages(){

  document
    .querySelectorAll(
      ".lazy-image:not([data-observing])"
    )
    .forEach(element => {

      element.dataset.observing =
        "true";

      imageObserver.observe(
        element
      );

    });

}


/* =========================================================
   エスケープ
========================================================= */

function escapeHTML(str){

  return String(str)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


/* =========================================================
   エリア変更
========================================================= */

function selectArea(area,button){

  currentArea = area;

  document
    .querySelectorAll(".area-btn")
    .forEach(btn =>
      btn.classList.remove("active")
    );

  button.classList.add("active");

  document.getElementById(
    "search"
  ).value = "";

  renderAttractions();

}


/* =========================================================
   アトラクション表示
========================================================= */

function renderAttractions(){

  const search =
    document
      .getElementById("search")
      .value
      .trim()
      .toLowerCase();


  const list =
    attractions.filter(item => {

      const name = item[0];
      const area = item[1];

      const areaOK =
        area === currentArea;

      const searchOK =
        !search ||
        name
          .toLowerCase()
          .includes(search);

      return areaOK && searchOK;

    });


  document.getElementById(
    "attractionCount"
  ).textContent =
    `${list.length}件`;


  const container =
    document.getElementById(
      "attractions"
    );

  container.innerHTML = "";


  list.forEach(item => {

    const name = item[0];
    const area = item[1];
    const id = item[2];

    const div =
      document.createElement("div");

    div.className = "card";

    div.innerHTML = `

      <div class="card-main">

        ${imageHTML(
          name,
          false,
          "attraction",
          id
        )}

        <div class="card-info">

          <div class="card-title">
            ${escapeHTML(name)}
          </div>

          <div class="card-area">
            📍 ${escapeHTML(area)}
          </div>

        </div>

      </div>

    `;


    div.onclick =
      () => selectAttraction(item);


    container.appendChild(div);

  });


  observeLazyImages();

}


/* =========================================================
   アトラクション選択
========================================================= */

function selectAttraction(item){

  selectedAttraction = item;

  const name = item[0];
  const area = item[1];
  const id = item[2];


  document
    .getElementById("result")
    .classList.remove("hidden");


  document.getElementById(
    "selectedName"
  ).textContent =
    "🎢 " + name;


  document.getElementById(
    "selectedArea"
  ).textContent =
    "📍 " + area;


  document.getElementById(
    "selectedOfficial"
  ).href =
    `${OFFICIAL}/tdl/attraction/detail/${id}/`;


  renderNearby();


  document
    .getElementById("result")
    .scrollIntoView({
      behavior:"smooth",
      block:"start"
    });

}


/* =========================================================
   周辺情報
========================================================= */

function renderNearby(){

  const area =
    selectedAttraction[1];

  const name =
    selectedAttraction[0];


  /* -----------------------------------------
     アトラクション
  ----------------------------------------- */

  const nearA =
    attractions.filter(x =>
      x[1] === area &&
      x[0] !== name
    );


  renderMini(
    "nearAttractions",
    nearA,
    "attraction"
  );


  /* -----------------------------------------
     レストラン
  ----------------------------------------- */

  const nearR =
    restaurants.filter(x =>
      x[1] === area
    );


  renderMini(
    "nearRestaurants",
    nearR,
    "restaurant"
  );


  /* -----------------------------------------
     ショップ
  ----------------------------------------- */

  const nearS =
    shops.filter(x =>
      x[1] === area
    );


  renderMini(
    "nearShops",
    nearS,
    "shop"
  );


  /* -----------------------------------------
     フォトスポット
  ----------------------------------------- */

  const nearP =
    photoSpots.filter(x =>
      x.area === area
    );


  const photoContainer =
    document.getElementById(
      "photoSpots"
    );


  photoContainer.innerHTML = "";


  if(!nearP.length){

    photoContainer.innerHTML =
      `
      <div class="loading">
        このエリアの登録フォトスポットはありません。
      </div>
      `;

  }else{

    nearP.forEach(photo => {

      const div =
        document.createElement("div");

      div.className =
        "photo-card";


      div.innerHTML = `

        <div class="photo-icon">
          ${photo.icon}
        </div>

        <div class="photo-title">
          ${escapeHTML(photo.name)}
        </div>

        <div class="photo-description">
          ${escapeHTML(photo.description)}
        </div>

        <div class="photo-source">

          出典：

          <a
            href="${photo.url}"
            target="_blank"
            rel="noopener"
          >
            ${escapeHTML(photo.source)}
          </a>

        </div>

      `;


      photoContainer.appendChild(div);

    });

  }


  observeLazyImages();

}


/* =========================================================
   ミニカード
========================================================= */

function renderMini(
  id,
  list,
  type
){

  const container =
    document.getElementById(id);

  container.innerHTML = "";


  if(!list.length){

    container.innerHTML =
      `
      <div class="loading">
        このエリアにはありません。
      </div>
      `;

    return;

  }


  list.forEach(item => {

    const name =
      item[0];

    const area =
      item[1];

    const detailId =
      item[2];


    const div =
      document.createElement("div");

    div.className =
      "mini-card";


    let link = "#";


    if(type === "attraction"){

      link =
        `${OFFICIAL}/tdl/attraction/detail/${detailId}/`;

    }

    else if(type === "restaurant"){

      link =
        `${OFFICIAL}/tdl/restaurant/detail/${detailId}/`;

    }

    else if(type === "shop"){

      link =
        `${OFFICIAL}/tdl/shop/detail/${detailId}/`;

    }


    div.innerHTML = `

      ${imageHTML(
        name,
        true,
        type,
        detailId
      )}

      <div class="mini-info">

        <div class="mini-name">
          ${escapeHTML(name)}
        </div>

        <div class="mini-area">
          📍 ${escapeHTML(area)}
        </div>

      </div>

    `;


    div.onclick = () => {

      if(link !== "#"){

        window.open(
          link,
          "_blank"
        );

      }

    };


    container.appendChild(div);

  });


  observeLazyImages();

}


/* =========================================================
   主要画像だけ最初に先読み
   → 初期画面の体感速度を優先
========================================================= */

function preloadImportantImages(){

  const preloadNames = [

    "オムニバス",
    "カリブの海賊",
    "シンデレラ",
    "プーさん",
    "美女と野獣",
    "グランドエンポーリアム",
    "ギャグファクトリー／ファイブ・アンド・ダイム"

  ];


  preloadNames.forEach(name => {

    const url =
      getKnownImage(name);

    if(!url){
      return;
    }


    const img =
      new Image();

    img.decoding =
      "async";

    img.src =
      url;

  });

}


/* =========================================================
   初期表示
========================================================= */

renderAttractions();


/* =========================================================
   重要画像だけ先読み
========================================================= */

if("requestIdleCallback" in window){

  requestIdleCallback(
    preloadImportantImages
  );

}else{

  setTimeout(
    preloadImportantImages,
    300
  );

}
