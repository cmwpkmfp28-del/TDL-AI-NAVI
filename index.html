<title>TDL AI NAVI</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Helvetica Neue",
    "Hiragino Kaku Gothic ProN",
    "Yu Gothic",
    sans-serif;
  background:#f5f6f8;
  color:#222;
}

header{
  background:linear-gradient(135deg,#243b55,#141e30);
  color:white;
  padding:20px 16px;
  position:sticky;
  top:0;
  z-index:100;
  box-shadow:0 3px 12px rgba(0,0,0,.15);
}

.header-inner{
  max-width:900px;
  margin:auto;
}

header h1{
  margin:0;
  font-size:22px;
}

header p{
  margin:5px 0 0;
  font-size:12px;
  opacity:.8;
}


/* =========================
   メイン
========================= */

main{
  max-width:900px;
  margin:auto;
  padding:18px 14px 60px;
}

.section-title{
  font-size:18px;
  font-weight:700;
  margin:10px 0 12px;
}


/* =========================
   エリア
========================= */

.area-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  margin-bottom:22px;
}

.area-button{
  border:none;
  background:white;
  border-radius:16px;
  padding:14px 8px;
  min-height:82px;
  font-size:13px;
  font-weight:700;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
  cursor:pointer;
  transition:.2s;
}

.area-button:active{
  transform:scale(.97);
}

.area-button.active{
  background:#243b55;
  color:white;
  transform:translateY(-2px);
  box-shadow:0 5px 15px rgba(0,0,0,.18);
}

.area-icon{
  display:block;
  font-size:27px;
  margin-bottom:5px;
}


/* =========================
   検索
========================= */

.search-box{
  margin-bottom:20px;
}

.search-box input{
  width:100%;
  border:none;
  background:white;
  padding:15px 16px;
  border-radius:14px;
  font-size:16px;
  outline:none;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}


/* =========================
   カード
========================= */

.card-list{
  display:grid;
  grid-template-columns:1fr;
  gap:14px;
}

.card{
  background:white;
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 3px 12px rgba(0,0,0,.08);
}

.image-wrap{
  width:100%;
  height:180px;
  background:
    linear-gradient(
      135deg,
      #e9edf2,
      #dce2e8
    );
  overflow:hidden;
}

.facility-image{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.no-image{
  height:100%;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:42px;
  color:#9ca3af;
}

.card-content{
  padding:15px;
}

.card-type{
  font-size:12px;
  color:#777;
  margin-bottom:4px;
}

.card h3{
  margin:0 0 5px;
  font-size:17px;
}

.card-area{
  display:inline-block;
  font-size:11px;
  background:#f0f2f5;
  border-radius:20px;
  padding:4px 9px;
  color:#555;
}

.card-description{
  font-size:13px;
  color:#666;
  line-height:1.6;
  margin:10px 0;
}

.detail-button{
  display:block;
  text-align:center;
  background:#243b55;
  color:white;
  text-decoration:none;
  padding:11px;
  border-radius:11px;
  font-size:13px;
  font-weight:bold;
  margin-top:10px;
}

.detail-button:active{
  transform:scale(.98);
}


/* =========================
   選択中
========================= */

.selected-box{
  background:white;
  border-radius:18px;
  padding:16px;
  margin-bottom:22px;
  box-shadow:0 3px 12px rgba(0,0,0,.08);
  border-left:5px solid #243b55;
}

.selected-label{
  font-size:12px;
  color:#777;
  margin-bottom:5px;
}

.selected-name{
  font-size:21px;
  font-weight:700;
}


/* =========================
   結果セクション
========================= */

.result-section{
  margin-top:26px;
}

.result-title{
  font-size:17px;
  font-weight:bold;
  margin:0 0 10px;
}

.empty{
  background:white;
  border-radius:15px;
  padding:20px;
  text-align:center;
  color:#888;
  font-size:13px;
}


/* =========================
   ステータス
========================= */

.status{
  margin-top:8px;
  font-size:12px;
  color:#d35400;
  font-weight:bold;
}


/* =========================
   PC
========================= */

@media(min-width:700px){

  .area-grid{
    grid-template-columns:repeat(4,1fr);
  }

  .card-list{
    grid-template-columns:repeat(2,1fr);
  }

}

</style>
</head>

const photos = [

 type:"📸 フォトスポット",

},

{

/* =====================================================
   絵文字
===================================================== */

const areaIconMap = {};

areas.forEach(area => {

  areaIconMap[area.name] = area.icon;

});


/* =====================================================
   状態
===================================================== */

let selectedArea = "";

let selectedAttraction = null;


/* =====================================================
   エリアボタン
===================================================== */

const areaButtons =
  document.getElementById("areaButtons");


areas.forEach(area => {

  const button =
    document.createElement("button");

  button.className = "area-button";

  button.innerHTML = `

    <span class="area-icon">
      ${area.icon}
    </span>

    <span>
      ${area.name}
    </span>

  `;

  button.addEventListener(
    "click",
    () => {

      document
        .querySelectorAll(".area-button")
        .forEach(b => {

          b.classList.remove("active");

        });


      button.classList.add("active");


      selectedArea =
        area.name;


      selectedAttraction =
        null;


      document
        .getElementById("searchInput")
        .value = "";


      document
        .getElementById("nearbyArea")
        .style.display = "none";


      renderAttractions();

    }
  );


  areaButtons.appendChild(button);

});


/* =====================================================
   初期表示
===================================================== */

selectedArea =
  "ファンタジーランド";


document
  .querySelectorAll(".area-button")
  .forEach(button => {

    if(
      button.innerText.includes(
        "ファンタジーランド"
      )
    ){

      button.classList.add("active");

    }

  });


renderAttractions();


/* =====================================================
   検索
===================================================== */

document
  .getElementById("searchInput")
  .addEventListener(
    "input",
    renderAttractions
  );


/* =====================================================
   画像
===================================================== */

function imageHTML(item){

  if(!item.image){

    return `

      <div class="no-image">

        📷

      </div>

    `;

  }


  return `

    <img
      class="facility-image"
      src="${item.image}"
      alt="${item.name}"
      loading="lazy"
      onerror="this.style.display='none'"
    >

  `;

}


/* =====================================================
   カード
===================================================== */

function createCard(item){

  const card =
    document.createElement("div");

  card.className = "card";


  card.innerHTML = `

    <div class="image-wrap">

      ${imageHTML(item)}

    </div>


    <div class="card-content">

      <div class="card-type">

        ${item.type}

      </div>


      <h3>

        ${item.name}

      </h3>


      <div class="card-area">

        ${areaIconMap[item.area] || ""}
        ${item.area}

      </div>


      <div class="card-description">

        ${item.description || ""}

      </div>


      ${
        item.status

        ?

        `<div class="status">
          ⚠️ ${item.status}
        </div>`

        :

        ""
      }


      <a
        class="detail-button"
        href="${item.url}"
        target="_blank"
        rel="noopener">

        公式詳細を見る ↗

      </a>

    </div>

  `;


  return card;

}


/* =====================================================
   アトラクション表示
===================================================== */

function renderAttractions(){

  const list =
    document.getElementById(
      "attractionList"
    );


  list.innerHTML = "";


  const keyword =
    document
      .getElementById("searchInput")
      .value
      .trim()
      .toLowerCase();


  const filtered =
    attractions.filter(item => {

      const areaOK =
        item.area === selectedArea;


      const keywordOK =
        !keyword ||
        item.name
          .toLowerCase()
          .includes(keyword);


      return areaOK && keywordOK;

    });


  if(filtered.length === 0){

    list.innerHTML = `

      <div class="empty">

        該当するアトラクションがありません。

      </div>

    `;

    return;

  }


  filtered.forEach(item => {

    const card =
      createCard(item);


    card.addEventListener(
      "click",
      event => {

        if(
          event.target.closest(
            ".detail-button"
          )
        ){

          return;

        }


        selectAttraction(item);

      }
    );


    list.appendChild(card);

  });

}


/* =====================================================
   アトラクション選択
===================================================== */

function selectAttraction(item){

  selectedAttraction =
    item;


  const selected =
    document.getElementById(
      "selectedArea"
    );


  selected.style.display =
    "block";


  selected.innerHTML = `

    <div class="selected-box">

      <div class="selected-label">

        📍 現在選択中

      </div>


      <div class="selected-name">

        ${item.name}

      </div>


    </div>

  `;


  renderNearby();


  window.scrollTo({

    top:
      selected.offsetTop - 80,

    behavior:"smooth"

  });

}


/* =====================================================
   周辺情報
===================================================== */

function renderNearby(){

  if(!selectedAttraction){

    return;

  }


  const nearby =
    document.getElementById(
      "nearbyArea"
    );


  nearby.style.display =
    "block";


  /*
   現段階では
   「同じエリア」
   を近くの施設として表示。

   後で座標を追加すれば
   本当の距離順にもできる。
  */


  const nearbyAttractions =
    attractions.filter(item =>

      item.area ===
      selectedAttraction.area &&

      item.name !==
      selectedAttraction.name

    );


  const nearbyRestaurants =
    restaurants.filter(item =>

      item.area ===
      selectedAttraction.area

    );


  const nearbyShops =
    shops.filter(item =>

      item.area ===
      selectedAttraction.area

    );


  const nearbyPhotos =
    photos.filter(item =>

      item.area ===
      selectedAttraction.area

    );


  nearby.innerHTML = "";


  addSection(
    nearby,
    "🎢 近くのアトラクション",
    nearbyAttractions
  );


  addSection(
    nearby,
    "🍴 近くのレストラン",
    nearbyRestaurants
  );


  addSection(
    nearby,
    "🛍️ 近くのショップ",
    nearbyShops
  );


  addSection(
    nearby,
    "📸 フォトスポット",
    nearbyPhotos
  );

}


/* =====================================================
   セクション追加
===================================================== */

function addSection(
  parent,
  title,
  items
){

  const section =
    document.createElement(
      "section"
    );


  section.className =
    "result-section";


  section.innerHTML = `

    <div class="result-title">

      ${title}

    </div>

  `;


  const list =
    document.createElement(
      "div"
    );


  list.className =
    "card-list";


  if(items.length === 0){

    list.innerHTML = `

      <div class="empty">

        このエリアでは
        現在登録されている施設がありません。

      </div>

    `;

  }


  items.forEach(item => {

    list.appendChild(
      createCard(item)
    );

  });


  section.appendChild(list);


  parent.appendChild(section);

}


</script>
