<title>TDL AI NAVI</title>

<style>

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{

  margin:0;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Helvetica Neue",
    "Hiragino Kaku Gothic ProN",
    "Yu Gothic",
    sans-serif;

  background:#f5f6f8;

  color:#222;

}

button,
input{
  font-family:inherit;
}


/* ================================
   HEADER
================================ */

header{

  position:sticky;

  top:0;

  z-index:100;

  color:white;

  background:
    linear-gradient(
      135deg,
      #243b55,
      #141e30
    );

  box-shadow:
    0 3px 12px rgba(0,0,0,.18);

}

.header-inner{

  max-width:1000px;

  margin:auto;

  padding:
    17px
    15px
    15px;

}

header h1{

  margin:0;

  font-size:21px;

}

header p{

  margin:5px 0 0;

  font-size:12px;

  opacity:.82;

}


/* ================================
   MAIN
================================ */

main{

  max-width:1000px;

  margin:auto;

  padding:
    18px
    14px
    70px;

}

.section-title{

  font-size:18px;

  font-weight:700;

  margin:
    12px
    0
    12px;

}


/* ================================
   AREA
================================ */

.area-grid{

  display:grid;

  grid-template-columns:
    repeat(2,1fr);

  gap:9px;

  margin-bottom:20px;

}

.area-button{

  border:0;

  background:white;

  border-radius:16px;

  padding:12px 6px;

  min-height:78px;

  font-size:12px;

  font-weight:700;

  color:#333;

  box-shadow:
    0 2px 8px rgba(0,0,0,.08);

  cursor:pointer;

  transition:.15s;

}

.area-button:active{

  transform:scale(.97);

}

.area-button.active{

  background:#243b55;

  color:white;

  transform:
    translateY(-1px);

  box-shadow:
    0 5px 14px rgba(0,0,0,.18);

}

.area-icon{

  display:block;

  font-size:25px;

  margin-bottom:5px;

}


/* ================================
   SEARCH
================================ */

.search-box{

  margin-bottom:20px;

}

.search-box input{

  width:100%;

  border:0;

  outline:0;

  background:white;

  border-radius:14px;

  padding:
    14px
    15px;

  font-size:16px;

  box-shadow:
    0 2px 8px rgba(0,0,0,.07);

}


/* ================================
   CARD
================================ */

.card-list{

  display:grid;

  grid-template-columns:
    repeat(2,minmax(0,1fr));

  gap:11px;

}

.card{

  background:white;

  border-radius:16px;

  overflow:hidden;

  box-shadow:
    0 2px 10px rgba(0,0,0,.08);

  min-width:0;

  cursor:pointer;

  transition:.15s;

}

.card:active{

  transform:scale(.98);

}


/* ================================
   IMAGE
================================ */

.image-wrap{

  width:100%;

  aspect-ratio:16 / 10;

  overflow:hidden;

  background:
    linear-gradient(
      135deg,
      #e8edf2,
      #d8dee5
    );

}

.facility-image{

  width:100%;

  height:100%;

  object-fit:cover;

  display:block;

}

.no-image{

  width:100%;

  height:100%;

  display:flex;

  flex-direction:column;

  align-items:center;

  justify-content:center;

  font-size:30px;

  color:#8e98a3;

}

.image-loading{

  width:100%;

  height:100%;

  display:flex;

  align-items:center;

  justify-content:center;

  color:#8e98a3;

  font-size:11px;

}


/* ================================
   CARD CONTENT
================================ */

.card-content{

  padding:11px;

}

.card-type{

  font-size:10px;

  color:#777;

  margin-bottom:4px;

}

.card h3{

  margin:
    0
    0
    6px;

  font-size:14px;

  line-height:1.35;

}

.card-area{

  display:inline-block;

  padding:
    3px
    7px;

  border-radius:20px;

  background:#f0f2f5;

  color:#555;

  font-size:9px;

}

.card-description{

  margin-top:8px;

  font-size:10px;

  line-height:1.5;

  color:#666;

}

.status{

  margin-top:7px;

  font-size:10px;

  line-height:1.4;

  color:#d35400;

  font-weight:bold;

}

.detail-button{

  display:block;

  margin-top:9px;

  padding:9px 5px;

  text-align:center;

  text-decoration:none;

  color:white;

  background:#243b55;

  border-radius:9px;

  font-size:10px;

  font-weight:bold;

}


/* ================================
   PHOTO SOURCE BUTTON
================================ */

.photo-source-button{

  display:block;

  margin-top:7px;

  padding:8px 5px;

  text-align:center;

  text-decoration:none;

  color:#243b55;

  background:#eef2f6;

  border-radius:9px;

  font-size:10px;

  font-weight:bold;

}


/* ================================
   SELECTED
================================ */

.selected-box{

  background:white;

  border-radius:17px;

  padding:15px;

  margin:
    22px
    0;

  border-left:
    5px solid
    #243b55;

  box-shadow:
    0 3px 12px rgba(0,0,0,.08);

}

.selected-label{

  font-size:11px;

  color:#777;

  margin-bottom:5px;

}

.selected-name{

  font-size:18px;

  font-weight:700;

}


/* ================================
   RESULT
================================ */

.result-section{

  margin-top:27px;

}

.result-title{

  display:flex;

  align-items:center;

  justify-content:space-between;

  font-size:17px;

  font-weight:bold;

  margin-bottom:10px;

}

.result-count{

  font-size:11px;

  color:#888;

  font-weight:normal;

}

.empty{

  grid-column:
    1 / -1;

  background:white;

  padding:20px;

  border-radius:14px;

  text-align:center;

  color:#888;

  font-size:12px;

}


/* ================================
   NOTICE
================================ */

.image-note{

  margin:
    8px
    0
    18px;

  padding:10px 12px;

  border-radius:12px;

  background:#edf2f7;

  color:#66717d;

  font-size:10px;

  line-height:1.5;

}


/* ================================
   PC
================================ */

@media(min-width:700px){

  .area-grid{

    grid-template-columns:
      repeat(4,1fr);

  }

  .card-list{

    grid-template-columns:
      repeat(3,minmax(0,1fr));

  }

}


/* ================================
   SMALL SMARTPHONE
================================ */

@media(max-width:360px){

  .card h3{

    font-size:13px;

  }

  .card-description{

    font-size:9px;

  }

}

</style>

/* =====================================================
   OFFICIAL IMAGE LOADER
=====================================================

   東京ディズニーリゾートの詳細ページから
   最初の画像URLを取得する。

   直接アクセスできない場合は
   カード側で📷表示にフォールバック。
===================================================== */

const imageCache = {};


async function getOfficialImage(pageURL){

  if(imageCache[pageURL]){
    return imageCache[pageURL];
  }


  try{

    const proxyURL =
      "https://r.jina.ai/" +
      pageURL;


    const response =
      await fetch(
        proxyURL,
        {
          method:"GET"
        }
      );


    if(!response.ok){
      throw new Error("image fetch failed");
    }


    const text =
      await response.text();


    /*
      Jina Readerが返すMarkdownから
      media1.tokyodisneyresort.jp の
      最初の画像URLを探す
    */

    const matches =
      text.match(
        /https?:\/\/media1\.tokyodisneyresort\.jp\/[^\s\)\]"']+/g
      );


    if(
      !matches ||
      !matches.length
    ){

      throw new Error("image not found");

    }


    let imageURL =
      matches[0];


    /*
      Markdown由来の不要な文字を除去
    */

    imageURL =
      imageURL
        .replace(/&amp;/g,"&")
        .replace(/\\_/g,"_");


    imageCache[pageURL] =
      imageURL;


    return imageURL;

  }catch(error){

    console.log(
      "公式画像取得失敗:",
      pageURL
    );

    return "";

  }

}

}


/* =====================================================
   LOAD IMAGES AFTER CARD CREATED
===================================================== */

async function loadCardImage(
  card,
  item
){

  const wrap =
    card.querySelector(
      ".image-wrap"
    );


  if(!wrap){
    return;
  }


  /*
    フォトスポットは
    外部サイトの記事画像を
   直接転載せず、
    場所情報を表示。
  */

  if(item.type === "📸 フォトスポット"){

    wrap.innerHTML = `

      <div class="no-image">

        📸

      </div>

    `;

    return;

  }


  if(!item.url){

    wrap.innerHTML = `

      <div class="no-image">
        📷
      </div>

    `;

    return;

  }


  const imageURL =
    await getOfficialImage(
      item.url
    );


  if(!imageURL){

    wrap.innerHTML = `

      <div class="no-image">

        📷

      </div>

    `;

    return;

  }


  const img =
    document.createElement(
      "img"
    );


  img.className =
    "facility-image";


  img.alt =
    item.name;


  img.loading =
    "lazy";


  img.referrerPolicy =
    "no-referrer";


  img.src =
    imageURL;


  img.onerror = () => {

    wrap.innerHTML = `

      <div class="no-image">
        📷
      </div>

    `;

  };


  wrap.innerHTML = "";


  wrap.appendChild(img);

}


/* =====================================================
   CARD
===================================================== */

function createCard(item){

  const card =
    document.createElement(
      "div"
    );


  card.className =
    "card";


  let type =
    item.type ||
    (
      item.detailId
      ? "🎢 アトラクション"
      : "🍴 レストラン"
    );


  if(item.source){
    type =
      "📸 フォトスポット";
  }


  const url =
    item.detailId
    ? attractionURL(item)
    : item.url;


  card.innerHTML = `

    <div class="image-wrap">

      ${imageHTML({
        ...item,
        type:type,
        url:url
      })}

    </div>


    <div class="card-content">

      <div class="card-type">

        ${type}

      </div>


      <h3>

        ${item.name}

      </h3>


      <div class="card-area">

        ${areaIconMap[item.area] || ""}
        ${item.area}

      </div>


      <div class="card-description">

        ${item.description || ""}

      </div>


      ${
        item.status
        ?
        `
          <div class="status">

            ⚠️ ${item.status}

          </div>
        `
        :
        ""
      }


      ${
        item.source
        ?
        `
          <a
            class="photo-source-button"
            href="${item.url}"
            target="_blank"
            rel="noopener noreferrer"
            referrerpolicy="no-referrer"
          >
            📸 撮影ポイントの詳細を見る ↗
          </a>
        `
        :
        `
          <a
            class="detail-button"
            href="${url}"
            target="_blank"
            rel="noopener noreferrer"
            referrerpolicy="no-referrer"
          >
            公式詳細を見る ↗
          </a>
        `
      }

    </div>

  `;


  /*
    画像はカード生成後に取得
  */

  setTimeout(() => {

    loadCardImage(
      card,
      {
        ...item,
        type:type,
        url:url
      }
    );

  },0);


  return card;

}

/* =====================================================
   RENDER ATTRACTIONS
===================================================== */

function renderAttractions(){

  const list =
    document.getElementById(
      "attractionList"
    );


  list.innerHTML = "";


  const keyword =
    document
      .getElementById(
        "searchInput"
      )
      .value
      .trim()
      .toLowerCase();


  const filtered =
    attractions.filter(
      item => {

        const areaOK =
          item.area ===
          selectedArea;


        const keywordOK =

          !keyword ||

          item.name
            .toLowerCase()
            .includes(
              keyword
            );


        return (
          areaOK &&
          keywordOK
        );

      }
    );


  if(
    filtered.length === 0
  ){

    list.innerHTML = `

      <div class="empty">

        該当する
        アトラクションがありません。

      </div>

    `;

    return;

  }


  filtered.forEach(item => {

    const card =
      createCard(item);


    card.addEventListener(
      "click",
      event => {

        if(
          event.target.closest(
            ".detail-button"
          )
        ){

          return;

        }


        selectAttraction(item);

      }
    );


    list.appendChild(card);

  });

}


/* =====================================================
   SELECT ATTRACTION
===================================================== */

function selectAttraction(
  item
){

  selectedAttraction =
    item;


  const selected =
    document.getElementById(
      "selectedArea"
    );


  selected.style.display =
    "block";


  selected.innerHTML = `

    <div class="selected-box">

      <div class="selected-label">

        📍 選択中のアトラクション

      </div>


      <div class="selected-name">

        ${item.name}

      </div>

    </div>

  `;


  renderNearby();


  setTimeout(() => {

    selected.scrollIntoView({
      behavior:"smooth",
      block:"start"
    });

  },50);

}


/* =====================================================
   NEARBY
===================================================== */

function renderNearby(){

  if(
    !selectedAttraction
  ){

    return;

  }


  const nearby =
    document.getElementById(
      "nearbyArea"
    );


  nearby.style.display =
    "block";


  nearby.innerHTML = "";


  /*
    現在は
    「同じエリア」
    を近くとして表示。

    将来的に緯度経度を追加すると
    実際の距離順に変更可能。
  */


  const nearbyAttractions =
    attractions.filter(
      item =>

        item.area ===
        selectedAttraction.area &&

        item.name !==
        selectedAttraction.name
    );


  const nearbyRestaurants =
    restaurants.filter(
      item =>

        item.area ===
        selectedAttraction.area
    );


  const nearbyShops =
    shops.filter(
      item =>

        item.area ===
        selectedAttraction.area
    );


  const nearbyPhotos =
    photos.filter(
      item =>

        item.area ===
        selectedAttraction.area
    );


  addSection(

    nearby,

    "🎢 近くのアトラクション",

    nearbyAttractions

  );


  addSection(

    nearby,

    "🍴 近くのレストラン",

    nearbyRestaurants

  );


  addSection(

    nearby,

    "🛍️ 近くのショップ",

    nearbyShops

  );


  addSection(

    nearby,

    "📸 フォトスポット",

    nearbyPhotos

  );

}


/* =====================================================
   SECTION
===================================================== */

function addSection(
  parent,
  title,
  items
){

  const section =
    document.createElement(
      "section"
    );


  section.className =
    "result-section";


  section.innerHTML = `

    <div class="result-title">

      <span>

        ${title}

      </span>

      <span class="result-count">

        ${items.length}件

      </span>

    </div>

  `;


  const list =
    document.createElement(
      "div"
    );


  list.className =
    "card-list";


  if(
    items.length === 0
  ){

    list.innerHTML = `

      <div class="empty">

        このエリアでは
        登録されている施設がありません。

      </div>

    `;

  }


  items.forEach(item => {

    list.appendChild(
      createCard(item)
    );

  });


  section.appendChild(
    list
  );


  parent.appendChild(
    section
  );

}
