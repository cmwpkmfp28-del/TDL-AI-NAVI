<title>TDL AI NAVI</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Helvetica Neue",
    "Hiragino Kaku Gothic ProN",
    "Yu Gothic",
    sans-serif;
  background:#f5f6f8;
  color:#222;
}

button,
input{
  font-family:inherit;
}

/* ================================
   ヘッダー
================================ */

header{
  position:sticky;
  top:0;
  z-index:100;
  color:white;
  background:
    linear-gradient(
      135deg,
      #243b55,
      #141e30
    );
  box-shadow:
    0 3px 12px rgba(0,0,0,.18);
}

.header-inner{
  max-width:1000px;
  margin:auto;
  padding:17px 15px 15px;
}

header h1{
  margin:0;
  font-size:21px;
}

header p{
  margin:5px 0 0;
  font-size:12px;
  opacity:.82;
}

/* ================================
   メイン
================================ */

main{
  max-width:1000px;
  margin:auto;
  padding:18px 14px 70px;
}

.section-title{
  font-size:18px;
  font-weight:700;
  margin:12px 0 12px;
}

/* ================================
   エリア
================================ */

.area-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:9px;
  margin-bottom:20px;
}

.area-button{
  border:0;
  background:white;
  border-radius:16px;
  padding:12px 6px;
  min-height:78px;
  font-size:12px;
  font-weight:700;
  color:#333;
  box-shadow:
    0 2px 8px rgba(0,0,0,.08);
  cursor:pointer;
  transition:.15s;
}

.area-button:active{
  transform:scale(.97);
}

.area-button.active{
  background:#243b55;
  color:white;
  transform:translateY(-1px);
  box-shadow:
    0 5px 14px rgba(0,0,0,.18);
}

.area-icon{
  display:block;
  font-size:25px;
  margin-bottom:5px;
}

/* ================================
   検索
================================ */

.search-box{
  margin-bottom:20px;
}

.search-box input{
  width:100%;
  border:0;
  outline:0;
  background:white;
  border-radius:14px;
  padding:14px 15px;
  font-size:16px;
  box-shadow:
    0 2px 8px rgba(0,0,0,.07);
}

/* ================================
   カード
================================ */

.card-list{
  display:grid;
  grid-template-columns:
    repeat(2,minmax(0,1fr));
  gap:11px;
}

.card{
  background:white;
  border-radius:16px;
  overflow:hidden;
  box-shadow:
    0 2px 10px rgba(0,0,0,.08);
  min-width:0;
  cursor:pointer;
  transition:.15s;
}

.card:active{
  transform:scale(.98);
}

/* ================================
   画像
================================ */

.image-wrap{
  width:100%;
  aspect-ratio:16 / 10;
  overflow:hidden;
  background:
    linear-gradient(
      135deg,
      #e8edf2,
      #d8dee5
    );
}

.facility-image{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.no-image{
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:34px;
  color:#8e98a3;
}

/* 読み込み中 */

.image-loading{
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:11px;
  color:#7d8791;
}

/* ================================
   カード本文
================================ */

.card-content{
  padding:11px;
}

.card-type{
  font-size:10px;
  color:#777;
  margin-bottom:4px;
}

.card h3{
  margin:0 0 6px;
  font-size:14px;
  line-height:1.35;
}

.card-area{
  display:inline-block;
  padding:3px 7px;
  border-radius:20px;
  background:#f0f2f5;
  color:#555;
  font-size:9px;
}

.card-description{
  margin-top:8px;
  font-size:10px;
  line-height:1.5;
  color:#666;
}

.status{
  margin-top:7px;
  font-size:10px;
  line-height:1.4;
  color:#d35400;
  font-weight:bold;
}

.source{
  margin-top:7px;
  font-size:9px;
  line-height:1.4;
  color:#888;
}

.detail-button{
  display:block;
  margin-top:9px;
  padding:9px 5px;
  text-align:center;
  text-decoration:none;
  color:white;
  background:#243b55;
  border-radius:9px;
  font-size:10px;
  font-weight:bold;
}

.photo-button{
  display:block;
  margin-top:7px;
  padding:8px 5px;
  text-align:center;
  text-decoration:none;
  color:#243b55;
  background:#edf2f7;
  border-radius:9px;
  font-size:10px;
  font-weight:bold;
}

/* ================================
   選択中
================================ */

.selected-box{
  background:white;
  border-radius:17px;
  padding:15px;
  margin:22px 0;
  border-left:5px solid #243b55;
  box-shadow:
    0 3px 12px rgba(0,0,0,.08);
}

.selected-label{
  font-size:11px;
  color:#777;
  margin-bottom:5px;
}

.selected-name{
  font-size:18px;
  font-weight:700;
}

/* ================================
   結果
================================ */

.result-section{
  margin-top:27px;
}

.result-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  font-size:17px;
  font-weight:bold;
  margin-bottom:10px;
}

.result-count{
  font-size:11px;
  color:#888;
  font-weight:normal;
}

.empty{
  grid-column:1 / -1;
  background:white;
  padding:20px;
  border-radius:14px;
  text-align:center;
  color:#888;
  font-size:12px;
}

/* ================================
   PC
================================ */

@media(min-width:700px){

  .area-grid{
    grid-template-columns:repeat(4,1fr);
  }

  .card-list{
    grid-template-columns:
      repeat(3,minmax(0,1fr));
  }

}

/* ================================
   小さいスマホ
================================ */

@media(max-width:360px){

  .card h3{
    font-size:13px;
  }

  .card-description{
    font-size:9px;
  }

}

</style>

/* =====================================================
   公式画像取得
===================================================== */

/*
  東京ディズニーリゾート公式ページから
  1枚目の画像を取得する。

  直接HTMLを取得できない場合は
  📷 に戻る。
*/

const imageCache = new Map();


async function getOfficialImage(url){

  if(!url){
    return null;
  }

  if(imageCache.has(url)){
    return imageCache.get(url);
  }

  try{

    const proxy =
      "https://api.allorigins.win/raw?url="
      + encodeURIComponent(url);

    const response =
      await fetch(proxy);

    if(!response.ok){
      throw new Error("画像取得失敗");
    }

    const html =
      await response.text();

    const parser =
      new DOMParser();

    const doc =
      parser.parseFromString(
        html,
        "text/html"
      );


    /*
      まず og:image を探す
    */

    let image =
      doc.querySelector(
        'meta[property="og:image"]'
      )?.getAttribute("content");


    /*
      og:image がない場合、
      media1.tokyodisneyresort.jp の
      最初の画像を探す。
    */

    if(!image){

      const images =
        [...doc.querySelectorAll("img")];

      const target =
        images.find(img =>
          (
            img.src ||
            img.getAttribute("data-src") ||
            ""
          )
          .includes(
            "media1.tokyodisneyresort.jp"
          )
        );

      if(target){

        image =
          target.src ||
          target.getAttribute("data-src");

      }

    }


    if(image){

      if(
        image.startsWith("//")
      ){

        image =
          "https:" + image;

      }

      else if(
        image.startsWith("/")
      ){

        image =
          "https://www.tokyodisneyresort.jp"
          + image;

      }

      imageCache.set(
        url,
        image
      );

      return image;

    }

  }

  catch(error){

    console.log(
      "公式画像取得エラー:",
      url
    );

  }


  imageCache.set(
    url,
    null
  );

  return null;

}


/* =====================================================
   画像HTML
===================================================== */

function imageHTML(item){

  /*
    フォトスポットは
    外部写真を転載しない。
  */

  if(
    item.type.includes("フォトスポット")
  ){

    return `

      <div class="no-image">
        📸
      </div>

    `;

  }


  return `

    <div
      class="image-loading"
      data-image-url="${item.url}"
    >

      📷 読み込み中…

    </div>

  `;

}


/* =====================================================
   画像読み込み
===================================================== */

async function loadCardImage(
  card,
  item
){

  if(
    item.type.includes("フォトスポット")
  ){

    return;

  }


  const wrapper =
    card.querySelector(
      ".image-wrap"
    );


  if(!wrapper){
    return;
  }


  const image =
    await getOfficialImage(
      item.url
    );


  if(image){

    wrapper.innerHTML = `

      <img

        class="facility-image"

        src="${image}"

        alt="${item.name}"

        loading="lazy"

      >

    `;

  }

  else{

    wrapper.innerHTML = `

      <div class="no-image">
        📷
      </div>

    `;

  }

}


/* =====================================================
   カード
===================================================== */

function createCard(item){

  const card =
    document.createElement(
      "div"
    );


  card.className =
    "card";


  card.innerHTML = `

    <div class="image-wrap">

      ${imageHTML(item)}

    </div>


    <div class="card-content">

      <div class="card-type">
        ${item.type}
      </div>


      <h3>
        ${item.name}
      </h3>


      <div class="card-area">

        ${areaIconMap[item.area] || ""}

        ${item.area}

      </div>


      <div class="card-description">

        ${item.description || ""}

      </div>


      ${
        item.status

        ?

        `
        <div class="status">

          ⚠️ ${item.status}

        </div>
        `

        :

        ""
      }


      ${
        item.source

        ?

        `
        <div class="source">

          📖 参考：
          ${item.source}

        </div>
        `

        :

        ""
      }


      <a

        class="detail-button"

        href="${item.url}"

        target="_blank"

        rel="noopener"

      >

        ${
          item.type.includes("フォトスポット")
          ?
          "撮影情報を見る ↗"
          :
          "公式詳細を見る ↗"
        }

      </a>

    </div>

  `;


  /*
    公式画像を非同期取得
  */

  loadCardImage(
    card,
    item
  );


  return card;

}

    "searchInput"
  )
  .addEventListener(
    "input",
    renderAttractions
  );


/* =====================================================
   アトラクション表示
===================================================== */

function renderAttractions(){

  const list =
    document.getElementById(
      "attractionList"
    );


  list.innerHTML = "";


  const keyword =
    document
      .getElementById(
        "searchInput"
      )
      .value
      .trim()
      .toLowerCase();


  const filtered =
    attractions.filter(item => {

      const areaOK =
        item.area ===
        selectedArea;


      const keywordOK =

        !keyword ||

        item.name
          .toLowerCase()
          .includes(
            keyword
          );


      return (
        areaOK &&
        keywordOK
      );

    });


  if(
    filtered.length === 0
  ){

    list.innerHTML = `

      <div class="empty">

        該当する
        アトラクションがありません。

      </div>

    `;

    return;

  }


  filtered.forEach(item => {

    const card =
      createCard(item);


    card.addEventListener(
      "click",
      event => {

        if(
          event.target.closest(
            ".detail-button"
          )
        ){

          return;

        }


        selectAttraction(item);

      }
    );


    list.appendChild(card);

  });

}


/* =====================================================
   アトラクション選択
===================================================== */

function selectAttraction(
  item
){

  selectedAttraction =
    item;


  const selected =
    document.getElementById(
      "selectedArea"
    );


  selected.style.display =
    "block";


  selected.innerHTML = `

    <div class="selected-box">

      <div class="selected-label">

        📍 選択中のアトラクション

      </div>


      <div class="selected-name">

        ${item.name}

      </div>

    </div>

  `;


  renderNearby();


  setTimeout(() => {

    selected.scrollIntoView({
      behavior:"smooth",
      block:"start"
    });

  },50);

}


/* =====================================================
   周辺情報
===================================================== */

function renderNearby(){

  if(
    !selectedAttraction
  ){

    return;

  }


  const nearby =
    document.getElementById(
      "nearbyArea"
    );


  nearby.style.display =
    "block";


  nearby.innerHTML = "";


  /*
    現在は同じエリアを
    「近く」として表示。
  */


  const nearbyAttractions =
    attractions.filter(
      item =>
        item.area ===
        selectedAttraction.area &&

        item.name !==
        selectedAttraction.name
    );


  const nearbyRestaurants =
    restaurants.filter(
      item =>
        item.area ===
        selectedAttraction.area
    );


  const nearbyShops =
    shops.filter(
      item =>
        item.area ===
        selectedAttraction.area
    );


  const nearbyPhotos =
    photos.filter(
      item =>
        item.area ===
        selectedAttraction.area
    );


  addSection(
    nearby,
    "🎢 近くのアトラクション",
    nearbyAttractions
  );


  addSection(
    nearby,
    "🍴 近くのレストラン",
    nearbyRestaurants
  );


  addSection(
    nearby,
    "🛍️ 近くのショップ",
    nearbyShops
  );


  addSection(
    nearby,
    "📸 フォトスポット",
    nearbyPhotos
  );

}


/* =====================================================
   セクション
===================================================== */

function addSection(
  parent,
  title,
  items
){

  const section =
    document.createElement(
      "section"
    );


  section.className =
    "result-section";


  section.innerHTML = `

    <div class="result-title">

      <span>
        ${title}
      </span>

      <span class="result-count">
        ${items.length}件
      </span>

    </div>

  `;


  const list =
    document.createElement(
      "div"
    );


  list.className =
    "card-list";


  if(
    items.length === 0
  ){

    list.innerHTML = `

      <div class="empty">

        このエリアでは
        登録されている施設がありません。

      </div>

    `;

  }


  items.forEach(item => {

    list.appendChild(
      createCard(item)
    );

  });


  section.appendChild(
    list
  );


  parent.appendChild(
    section
  );

}


/* =====================================================
   初期表示
===================================================== */

renderAttractions();

</script>

</body>

</html>
