.spot-type {

.spot-name {

  margin-top: 3px;

}

.spot-distance {

  color: #888;
  margin-top: 5px;
}

.empty {

  background: white;

  padding: 30px 18px;
  color: #777;

.footer {

  color: #999;
  font-size: 11px;
  padding: 30px 10px;
}

/* =========================
   現在地取得
========================= */

function getLocation() {

  const status = document.getElementById("status");

  if (!navigator.geolocation) {
    status.textContent = "このブラウザでは位置情報を利用できません。";
    return;
  }

  status.textContent = "現在地を取得しています…";

  navigator.geolocation.getCurrentPosition(

    function(position) {

      const lat = position.coords.latitude;
      const lng = position.coords.longitude;

      document.getElementById("locationName").textContent =
        "現在地を取得しました";

      status.textContent =
        "近くのアトラクションを探しています…";

      showNearby(lat, lng);

    },

    function(error) {

      status.textContent =
        "位置情報を取得できませんでした。位置情報の許可を確認してください。";

    },

    {
      enableHighAccuracy: true,
      timeout: 10000,
      maximumAge: 30000
    }

  );
}


/* =========================
   近くのアトラクション検索
========================= */

function showNearby(lat, lng) {

  let nearest = null;
  let nearestDistance = Infinity;

  attractions.forEach(function(attraction) {

    const distance =
      getDistance(lat, lng, attraction.lat, attraction.lng);

    if (distance < nearestDistance) {
      nearestDistance = distance;
      nearest = attraction;
    }

  });

  if (!nearest) {
    document.getElementById("result").innerHTML =
      '<div class="empty">近くのスポットが見つかりませんでした。</div>';
    return;
  }

  showResult(nearest, nearestDistance);
}


/* =========================
   結果表示
========================= */

function showResult(attraction, distance) {

  const distanceText =
    distance < 1000
      ? Math.round(distance) + "m"
      : (distance / 1000).toFixed(1) + "km";

  let html = `

    <div class="section-title">
      🎢 近くのアトラクション
    </div>

    <div class="nearby-main">

      <div class="attraction-label">
        ${attraction.area}
      </div>

      <div class="attraction-name">
        ${attraction.name}
      </div>

      <div class="distance">
        📍 現在地から約 ${distanceText}
      </div>

      <div class="section-title" style="font-size:17px;margin-top:20px;">
        この周辺でできること
      </div>

      <div class="spot-grid">
  `;

  attraction.spots.forEach(function(spot) {

    html += `

      <div class="spot-card">

        <div class="spot-icon">
          ${spot[0]}
        </div>

        <div class="spot-type">
          ${spot[1]}
        </div>

        <div class="spot-name">
          ${spot[2]}
        </div>

        <div class="spot-distance">
          ${spot[3]}
        </div>

      </div>

    `;

  });

  html += `
      </div>
    </div>
  `;

  document.getElementById("result").innerHTML = html;
}

}


/* =========================
   距離計算
========================= */

function getDistance(lat1, lon1, lat2, lon2) {

  const R = 6371000;

  const rad = Math.PI / 180;

  const dLat = (lat2 - lat1) * rad;
  const dLon = (lon2 - lon1) * rad;

  const a =
    Math.sin(dLat / 2) ** 2 +
    Math.cos(lat1 * rad) *
    Math.cos(lat2 * rad) *
    Math.sin(dLon / 2) ** 2;

  const c =
    2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));

  return R * c;

}
