*{

}

body{

  color:#222;
}

header{
  position:sticky;
  top:0;
  z-index:100;
  background:white;
  padding:14px 16px;
  border-bottom:1px solid #ddd;
}

header h1{
  margin:0;
  font-size:20px;
}

.container{
  max-width:900px;
  margin:auto;
  padding:16px;
}

h2{
  margin-top:28px;
  font-size:19px;
}

.area-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}

.area-btn{
  border:0;
  background:white;
  border-radius:14px;
  padding:16px 10px;
  font-size:15px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.area-btn.active{
  background:#222;
  color:white;
}

.search{
  width:100%;
  padding:13px;
  margin:16px 0;
  border:1px solid #ddd;
  border-radius:12px;
  font-size:16px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}

.card{
  background:white;
  border-radius:16px;
  overflow:hidden;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.card-image{
  width:100%;
  aspect-ratio:16/10;
  background:linear-gradient(135deg,#eef2f5,#dfe5ea);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:40px;
  overflow:hidden;
}

.card-image img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.card-body{
  padding:12px;
}

.card-title{
  font-weight:bold;
  font-size:15px;
  line-height:1.4;
}

.card-area{
  font-size:12px;
  color:#777;
  margin-top:4px;
}

.card-desc{
  font-size:13px;
  line-height:1.5;
  margin-top:7px;
}

.tags{
  display:flex;
  flex-wrap:wrap;
  gap:5px;
  margin-top:8px;
}

.tag{
  background:#f0f2f5;
  border-radius:20px;
  padding:4px 7px;
  font-size:11px;
}

.detail-btn{
  display:block;
  text-align:center;
  text-decoration:none;
  background:#222;
  color:white;
  padding:10px;
  border-radius:9px;
  margin-top:10px;
  font-size:13px;
}

.fallback-btn{
  display:block;
  text-align:center;
  text-decoration:none;
  color:#555;
  font-size:11px;
  margin-top:8px;
}

.selected{
  background:white;
  border-radius:16px;
  padding:15px;
  margin-top:16px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.selected-title{
  font-weight:bold;
  font-size:18px;
}

.note{
  font-size:12px;
  color:#777;
  margin-top:8px;
}

.empty{
  background:white;
  padding:20px;
  border-radius:14px;
  text-align:center;
  color:#777;
}

@media(min-width:700px){

  .area-grid{
    grid-template-columns:repeat(4,1fr);
  }

  .grid{
    grid-template-columns:repeat(3,1fr);
  }

}

</style>

/* =========================================================
   エリア
========================================================= */

let currentArea = "ワールドバザール";
let selectedAttraction = null;


/* =========================================================
   エリア選択
========================================================= */

function selectArea(area,button){

  currentArea = area;

  document.querySelectorAll(".area-btn").forEach(btn=>{
    btn.classList.remove("active");
  });

  button.classList.add("active");

  selectedAttraction = null;

  document.getElementById("selectedBox").innerHTML="";
  document.getElementById("nearby").innerHTML="";

  renderAttractions();
}


/* =========================================================
   アトラクション表示
========================================================= */

function renderAttractions(){

  const keyword =
    document.getElementById("search").value.toLowerCase();

  const list = attractions.filter(item =>

    item.area === currentArea &&

    (
      item.name.toLowerCase().includes(keyword) ||
      item.desc.toLowerCase().includes(keyword)
    )

  );

  const box = document.getElementById("attractions");

  if(list.length === 0){

    box.innerHTML =
      `<div class="empty">該当するアトラクションがありません</div>`;

    return;
  }

  box.innerHTML = list.map((item,index)=>`

    <div class="card">

      <div class="card-image">
        ${item.emoji}
      </div>

      <div class="card-body">

        <div class="card-title">
          ${item.name}
        </div>

        <div class="card-area">
          📍 ${item.area}
        </div>

        <div class="card-desc">
          ${item.desc}
        </div>

        ${
          item.status
          ?
          `<div class="tags">
             <span class="tag">${item.status}</span>
           </div>`
          :
          ""
        }

        <button
          class="detail-btn"
          onclick="selectAttraction(${attractions.indexOf(item)})"
        >
          この場所から探す
        </button>

      </div>

    </div>

  `).join("");

}


/* =========================================================
   アトラクション選択
========================================================= */

function selectAttraction(index){

  selectedAttraction = attractions[index];

  document.getElementById("selectedBox").innerHTML = `

    <div class="selected">

      <div class="selected-title">
        📍 ${selectedAttraction.name}
      </div>

      <div class="note">
        この周辺で行けそうな場所を表示しています。
      </div>

    </div>

  `;

  renderNearby();

}


/* =========================================================
   近くの施設
========================================================= */

function renderNearby(){

  if(!selectedAttraction) return;

  const area = selectedAttraction.area;

  const nearbyAttractions =
    attractions.filter(item =>
      item.area === area &&
      item.name !== selectedAttraction.name
    );

  const nearbyRestaurants =
    restaurants.filter(item =>
      item.area === area
    );

  const nearbyShops =
    shops.filter(item =>
      item.area === area
    );


  document.getElementById("nearby").innerHTML = `

    <h2>🎢 近くのアトラクション</h2>

    <div class="grid">

      ${
        nearbyAttractions.length
        ?
        nearbyAttractions.map(item=>`

          <div class="card">

            <div class="card-image">
              ${item.emoji}
            </div>

            <div class="card-body">

              <div class="card-title">
                ${item.name}
              </div>

              <div class="card-desc">
                ${item.desc}
              </div>

              <a
                class="detail-btn"
                href="${item.url}"
                target="_blank"
                rel="noopener noreferrer"
                referrerpolicy="no-referrer"
              >
                公式詳細を見る ↗
              </a>

            </div>

          </div>

        `).join("")
        :
        `<div class="empty">なし</div>`
      }

    </div>


    <h2>🍴 近くのレストラン</h2>

    <div class="grid">

      ${
        nearbyRestaurants.map(item=>`

          <div class="card">

            <div class="card-image">
              ${item.emoji}
            </div>

            <div class="card-body">

              <div class="card-title">
                ${item.name}
              </div>

              <div class="card-desc">
                ${item.desc}
              </div>

              <a
                class="detail-btn"
                href="${item.url}"
                target="_blank"
                rel="noopener noreferrer"
                referrerpolicy="no-referrer"
              >
                公式詳細を見る ↗
              </a>

            </div>

          </div>

        `).join("")
      }

    </div>


    <h2>🛍️ 近くのショップ</h2>

    <div class="grid">

      ${
        nearbyShops.map(item=>`

          <div class="card">

            <div class="card-image">
              🛍️
            </div>

            <div class="card-body">

              <div class="card-title">
                ${item.name}
              </div>

              <div class="card-area">
                📍 ${item.area}
              </div>

              <div class="card-desc">
                ${item.desc}
              </div>

              <div class="tags">

                ${
                  item.tags.map(tag=>
                    `<span class="tag">${tag}</span>`
                  ).join("")
                }

              </div>

              ${
                item.status
                ?
                `<div class="tags">
                   <span class="tag">${item.status}</span>
                 </div>`
                :
                ""
              }

              <a
                class="detail-btn"
                href="${item.url}"
                target="_blank"
                rel="noopener noreferrer"
                referrerpolicy="no-referrer"
              >
                ${
                  item.url === OFFICIAL.shops
                  ? "公式ショップ一覧を見る ↗"
                  : "ショップ詳細を見る ↗"
                }
              </a>

            </div>

          </div>

        `).join("")
      }

    </div>


    <div class="note">
      ※「近く」は現在、同じエリアを基準にしています。
    </div>

  `;

}
