* {

body {

header {

.header-sub {

header h1 {

header p {

.container {

.label {

  font-size: 16px;
  font-weight: bold;
}

.result {
  margin-top: 25px;
}

.place-header {
  margin-bottom: 15px;
}

.place-area {
  font-size: 12px;
  color: #777;
}

.place-name {
  font-size: 24px;
  font-weight: 800;
  margin-top: 4px;
}

.category {
  margin-top: 25px;
}

.category-title {
  font-size: 19px;
  font-weight: 800;
  margin-bottom: 10px;
}

.card {
  background: white;
  border-radius: 18px;
  padding: 16px;
  margin-bottom: 10px;
  box-shadow: 0 3px 14px rgba(0,0,0,.05);
}

.card-top {
  display: flex;
  gap: 12px;
}

.icon {
  font-size: 28px;
}

.card-name {
  font-size: 16px;
  font-weight: 800;
}

.card-description {
  color: #666;
  font-size: 13px;
  line-height: 1.5;
  margin-top: 4px;
}

.official {
  display: inline-block;
  margin-top: 12px;
  padding: 9px 12px;
  border-radius: 10px;
  background: #eef0f6;
  color: #28314e;
  text-decoration: none;
  font-size: 12px;
  font-weight: bold;
}

.empty {
  background: white;
  border-radius: 20px;
  padding: 25px;
  text-align: center;
  color: #777;
  margin-top: 20px;
}

.footer {
  text-align: center;
  color: #aaa;
  font-size: 11px;
  padding: 30px;

/* ===================================
   セレクトボックスを作る
=================================== */

const select = document.getElementById("attractionSelect");

attractions.forEach((attraction, index) => {

  const option = document.createElement("option");

  option.value = index;
  option.textContent =
    attraction.name + "　（" + attraction.area + "）";

  select.appendChild(option);

});


/* ===================================
   結果表示
=================================== */

function showNearby() {

  const index = select.value;

  if (index === "") {

    document.getElementById("result").innerHTML = `
      <div class="empty">
        まずアトラクションを選んでね🎢
      </div>
    `;

    return;
  }

  const attraction = attractions[index];

  const categories = [
    {
      key: "goods",
      icon: "🛍️",
      title: "グッズ"
    },
    {
      key: "food",
      icon: "🍴",
      title: "フード"
    },
    {
      key: "photo",
      icon: "📸",
      title: "フォトスポット"
    },
    {
      key: "attractions",
      icon: "🎢",
      title: "近くのアトラクション"
    }
  ];

  let html = `

    <div class="place-header">

      <div class="place-area">
        ${attraction.area}
      </div>

      <div class="place-name">
        ${attraction.name}
      </div>

    </div>

  `;


  categories.forEach(category => {

    const items = attraction.spots[category.key];

    html += `

      <div class="category">

        <div class="category-title">
          ${category.icon}
          ${category.title}
        </div>

    `;


    items.forEach(item => {

      html += `

        <div class="card">

          <div class="card-top">

            <div class="icon">
              ${category.icon}
            </div>

            <div>

              <div class="card-name">
                ${item.name}
              </div>

              <div class="card-description">
                ${item.description}
              </div>

            </div>

          </div>

          <a
            class="official"
            href="${item.url}"
            target="_blank"
            rel="noopener noreferrer"
          >
            公式サイトを見る ↗
          </a>

        </div>

      `;

    });


    html += `</div>`;

  });


  document.getElementById("result").innerHTML = html;

}
