<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TDL AI NAVI</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",
  "Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
  background:#f5f6f8;
  color:#222;
}

header{
  position:sticky;
  top:0;
  z-index:100;
  background:#111827;
  color:white;
  padding:15px 16px;
  box-shadow:0 2px 10px rgba(0,0,0,.15);
}

.header-inner{
  max-width:1200px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  font-size:20px;
  font-weight:800;
}

.subtitle{
  font-size:11px;
  opacity:.7;
}

main{
  max-width:1200px;
  margin:auto;
  padding:20px 14px 60px;
}

h2{
  margin:28px 0 12px;
  font-size:20px;
}

h3{
  margin:0 0 10px;
  font-size:17px;
}

.area-buttons{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px;
}

.area-btn{
  border:none;
  background:white;
  border-radius:12px;
  padding:13px 8px;
  font-size:14px;
  font-weight:700;
  box-shadow:0 2px 8px rgba(0,0,0,.07);
  cursor:pointer;
}

.area-btn.active{
  background:#111827;
  color:white;
}

.search{
  width:100%;
  margin:15px 0;
  padding:13px 15px;
  border:1px solid #ddd;
  border-radius:12px;
  font-size:16px;
  outline:none;
  background:white;
}

.search:focus{
  border-color:#111827;
}

.attraction-grid,
.card-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}

.card{
  background:white;
  border-radius:14px;
  overflow:hidden;
  box-shadow:0 2px 9px rgba(0,0,0,.08);
}

.image-wrap{
  width:100%;
  height:125px;
  background:linear-gradient(135deg,#e8eaf0,#f5f5f5);
  position:relative;
  overflow:hidden;
}

.image-wrap img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.image-placeholder{
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:38px;
  color:#aaa;
}

.card-body{
  padding:11px;
}

.card-title{
  font-size:14px;
  font-weight:800;
  line-height:1.4;
}

.card-area{
  font-size:11px;
  color:#777;
  margin-top:4px;
}

.card-description{
  font-size:11px;
  color:#555;
  line-height:1.5;
  margin-top:7px;
}

.card-buttons{
  display:flex;
  gap:6px;
  margin-top:9px;
}

button,
a{
  -webkit-tap-highlight-color:transparent;
}

.detail-btn{
  flex:1;
  border:none;
  border-radius:8px;
  padding:8px 5px;
  background:#111827;
  color:white;
  text-decoration:none;
  text-align:center;
  font-size:11px;
  font-weight:700;
}

.select-btn{
  flex:1;
  border:1px solid #111827;
  border-radius:8px;
  padding:8px 5px;
  background:white;
  color:#111827;
  font-size:11px;
  font-weight:700;
}

.selected-box{
  margin-top:18px;
  padding:16px;
  background:white;
  border-radius:15px;
  box-shadow:0 2px 10px rgba(0,0,0,.08);
  border-left:5px solid #111827;
}

.selected-name{
  font-size:18px;
  font-weight:800;
}

.selected-area{
  color:#777;
  font-size:12px;
  margin-top:4px;
}

.section{
  margin-top:25px;
}

.section-title{
  display:flex;
  align-items:center;
  gap:7px;
  margin-bottom:10px;
}

.empty{
  background:white;
  padding:18px;
  border-radius:12px;
  color:#777;
  text-align:center;
  font-size:13px;
}

.photo-card .image-wrap{
  height:160px;
}

.source{
  font-size:10px;
  color:#888;
  margin-top:7px;
}

.notice{
  background:#fff;
  border-radius:12px;
  padding:13px;
  font-size:12px;
  color:#666;
  line-height:1.6;
  margin-top:15px;
}

@media(min-width:700px){
  .area-buttons{
    grid-template-columns:repeat(4,1fr);
  }

  .attraction-grid,
  .card-grid{
    grid-template-columns:repeat(3,1fr);
  }

  .image-wrap{
    height:160px;
  }
}
</style>
</head>

========================================================= */

  document.getElementById("areaButtons");

areas.forEach(area => {

  const button =
    document.createElement("button");

  button.className = "area-btn";
  button.textContent = area;

  button.onclick = () => {

    selectedArea = area;

    document
      .querySelectorAll(".area-btn")
      .forEach(b => b.classList.remove("active"));

    button.classList.add("active");

    renderAttractions();
    renderSelectedArea();
  };

  areaButtons.appendChild(button);
});


/* =========================================================
   アトラクション表示
========================================================= */

function renderAttractions(){

  const keyword =
    document
      .getElementById("searchInput")
      .value
      .trim()
      .toLowerCase();

  const list =
    document.getElementById("attractionList");

  list.innerHTML = "";

  const filtered =
    attractions.filter(a => {

      const areaOK =
        !selectedArea ||
        a[1] === selectedArea;

      const searchOK =
        !keyword ||
        a[0].toLowerCase().includes(keyword);

      return areaOK && searchOK;
    });

  if(filtered.length === 0){

    list.innerHTML =
      `<div class="empty">該当するアトラクションがありません</div>`;

    return;
  }

  filtered.forEach(a => {

    const [
      name,
      area,
      url,
      emoji
    ] = a;

    const card =
      document.createElement("div");

    card.className = "card";

    card.innerHTML = `

      <div class="image-wrap">

        <div
          class="image-placeholder"
          data-official-url="${OFFICIAL + url}"
          data-emoji="${emoji}"
        >
          ${emoji}
        </div>

      </div>

      <div class="card-body">

        <div class="card-title">
          ${name}
        </div>

        <div class="card-area">
          ${area}
        </div>

        <div class="card-buttons">

          <button class="select-btn">
            ここから探す
          </button>

          <a
            class="detail-btn"
            href="${OFFICIAL + url}"
            target="_blank"
            rel="noopener"
          >
            公式サイト
          </a>

        </div>

      </div>
    `;

    card
      .querySelector(".select-btn")
      .onclick = () => {

        selectedAttraction = {
          name,
          area,
          url,
          emoji
        };

        renderSelectedArea();
        renderNearby();

        window.scrollTo({
          top:
            document
              .getElementById("selectedArea")

      };

    list.appendChild(card);

  });

  loadImages();
}

/* =========================================================
   公式画像取得
========================================================= */

async function findOfficialImage(url){

  let cache = {};

  try{

    cache =
      JSON.parse(
        localStorage.getItem(
          IMAGE_CACHE_KEY
        ) || "{}"
      );

  }catch(e){

    cache = {};

  }


  /* キャッシュ */

  if(cache[url]){

    return cache[url];

  }


  try{

    const response =
      await fetch(
        "https://r.jina.ai/" + url,
        {
          cache:"no-store"
        }
      );

    if(!response.ok){

      return null;

    }

    const text =
      await response.text();


    /*
      公式ページの画像表記を
      複数パターンで検索する。
    */

    const patterns = [

      /*
        [Image: ○○のイメージ1](URL)
      */

      /\[Image:\s*[^\]]*?イメージ\s*1[^\]]*\]\((https:\/\/media1\.tokyodisneyresort\.jp\/[^)\s]+)\)/i,

      /*
        ![○○のイメージ1](URL)
      */

      /!\[[^\]]*?イメージ\s*1[^\]]*\]\((https:\/\/media1\.tokyodisneyresort\.jp\/[^)\s]+)\)/i,

      /*
        Image: ○○のイメージ1 ... (URL)
      */

      /Image:\s*[^\n]*?イメージ\s*1[^\n]*?\((https:\/\/media1\.tokyodisneyresort\.jp\/[^)\s]+)\)/i,

      /*
        HTML img
      */

      /<img[^>]+(?:alt|title)="[^"]*?イメージ\s*1[^"]*"[^>]+src="(https:\/\/media1\.tokyodisneyresort\.jp\/[^"]+)"/i,

      /*
        src → alt の順番
      */

      /<img[^>]+src="(https:\/\/media1\.tokyodisneyresort\.jp\/[^"]+)"[^>]+(?:alt|title)="[^"]*?イメージ\s*1[^"]*"/i

    ];


    for(const pattern of patterns){

      const match =
        text.match(pattern);

      if(match && match[1]){

        let imageUrl =
          match[1];

        /*
          HTMLエンコード等を処理
        */

        imageUrl =
          imageUrl
            .replace(/&amp;/g,"&")
            .replace(/\\u0026/g,"&");

        cache[url] =
          imageUrl;

        try{

          localStorage.setItem(
            IMAGE_CACHE_KEY,
            JSON.stringify(cache)
          );

        }catch(e){}

        return imageUrl;
      }
    }

  }catch(error){

    console.log(
      "画像取得エラー",
      error
    );

  }

  return null;
}


/* =========================================================
   画像ロード
========================================================= */

function loadImages(){

  const elements =
    document.querySelectorAll(
      ".image-placeholder[data-official-url]"
    );

  if(!elements.length){

    return;

  }


  const observer =
    new IntersectionObserver(
      entries => {

        entries.forEach(entry => {

          if(!entry.isIntersecting){

            return;

          }

          const element =
            entry.target;

          observer.unobserve(element);

          const url =
            element.dataset.officialUrl;

          const emoji =
            element.dataset.emoji || "📍";

          findOfficialImage(url)
            .then(imageUrl => {

              if(!imageUrl){

                element.innerHTML =
                  emoji;

                return;

              }

              const img =
                document.createElement("img");

              img.loading = "lazy";
              img.decoding = "async";
              img.alt = "";

              img.src =
                imageUrl;

              img.onerror =
                () => {

                  element.innerHTML =
                    emoji;

                };

              element.innerHTML = "";

              element.appendChild(img);

            });

        });

      },
      {
        rootMargin:"500px"
      }
    );


  elements.forEach(element => {

    observer.observe(element);

  });

}
