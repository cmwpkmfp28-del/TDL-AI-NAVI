<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:

  background:#f5f6f8;
  color:#222;
}

header{
  position:sticky;
  top:0;
  z-index:100;
  background:#111827;
  color:white;
  padding:14px 16px;
  box-shadow:0 2px 10px rgba(0,0,0,.15);
}

.header-inner{
  max-width:1100px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  font-size:20px;
  font-weight:800;
}

.sub-logo{
  font-size:11px;
  opacity:.7;
}

main{
  max-width:1100px;
  margin:auto;
  padding:20px 14px 60px;
}

h2{
  margin:26px 0 12px;
  font-size:19px;
}

h3{
  margin:0 0 8px;
}

.search{
  width:100%;
  padding:13px 15px;
  border:1px solid #ddd;
  border-radius:12px;
  font-size:16px;
  background:white;
  margin-bottom:14px;
}

.area-buttons{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px;
}

.area-btn{
  border:0;
  border-radius:12px;
  padding:12px 8px;
  background:white;
  box-shadow:0 1px 5px rgba(0,0,0,.08);
  font-size:14px;
  font-weight:700;
  cursor:pointer;
}

.area-btn.active{
  background:#111827;
  color:white;
}

.attraction-grid,
.card-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}

.card{
  background:white;
  border-radius:14px;
  overflow:hidden;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.card-image{
  width:100%;
  aspect-ratio:16/10;
  background:#e9edf2;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  position:relative;
}

.card-image img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.image-placeholder{
  color:#7b8491;
  font-size:13px;
  text-align:center;
  padding:10px;
}

.card-body{
  padding:11px;
}

.card-title{
  font-size:15px;
  font-weight:800;
  line-height:1.4;
}

.card-area{
  font-size:12px;
  color:#777;
  margin-top:4px;
}

.card-desc{
  font-size:12px;
  line-height:1.5;
  color:#555;
  margin-top:7px;
}

.card-buttons{
  display:flex;
  gap:6px;
  margin-top:10px;
}

.card-buttons a,
.card-buttons button{
  flex:1;
  border:0;
  border-radius:8px;
  padding:8px 5px;
  text-align:center;
  text-decoration:none;
  font-size:11px;
  font-weight:700;
  cursor:pointer;
}

.official{
  background:#111827;
  color:white;
}

.select-btn{
  background:#e9eef7;
  color:#1e3a5f;
}

.selected-box{
  background:#111827;
  color:white;
  border-radius:16px;
  padding:16px;
  margin-top:18px;
  box-shadow:0 3px 12px rgba(0,0,0,.15);
}

.selected-name{
  font-size:18px;
  font-weight:800;
}

.selected-area{
  opacity:.7;
  font-size:12px;
  margin-top:3px;
}

.section{
  margin-top:22px;
}

.section-title{
  display:flex;
  align-items:center;
  gap:6px;
  font-size:17px;
  font-weight:800;
  margin-bottom:10px;
}

.photo-card{
  background:white;
  border-radius:14px;
  overflow:hidden;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.photo-card img{
  width:100%;
  aspect-ratio:16/10;
  object-fit:cover;
  display:block;
}

.photo-body{
  padding:12px;
}

.source{
  font-size:11px;
  color:#777;
  margin-top:7px;
}

.empty{
  background:white;
  border-radius:12px;
  padding:18px;
  text-align:center;
  color:#777;
  font-size:13px;
}

.loading{
  padding:14px;
  text-align:center;
  color:#777;
  font-size:12px;
}

.notice{
  background:#fff8df;
  border:1px solid #f2df9a;
  border-radius:12px;
  padding:12px;
  font-size:12px;
  line-height:1.6;
  margin-bottom:16px;
}

@media(min-width:700px){
  .area-buttons{
    grid-template-columns:repeat(4,1fr);
  }

  .attraction-grid,
  .card-grid{
    grid-template-columns:repeat(3,1fr);
  }
}

@media(max-width:390px){
  .attraction-grid,
  .card-grid{
    grid-template-columns:1fr;
  }
}
</style>
</head>

/* =====================================================
   URL生成
===================================================== */

function attractionUrl(item){
  return `${OFFICIAL_BASE}/tdl/attraction/detail/${item.id}/`;
}

function shopUrl(item){
  return `${OFFICIAL_BASE}/tdl/shop/detail/${item.id}/`;
}

function restaurantUrl(item){
  return `${OFFICIAL_BASE}/tdl/restaurant/detail/${item.id}/`;
}


/* =====================================================
   公式ページから「イメージ1」だけを取得
===================================================== */

async function getOfficialImage(url, type){

  try{

    /*
      公式ページそのものを直接読み込むと
      ブラウザのCORS制限があるため、
      Jina Reader経由で公式ページの内容だけ取得する。

      重要：
      「ページ内の最初の画像」は絶対に使わない。
      「イメージ1」に一致する画像だけ探す。
    */

    const response =
      await fetch(
        "https://r.jina.ai/" + url,
        {
          cache:"no-store"
        }
      );

    if(!response.ok){
      return null;
    }

    const text = await response.text();

    /*
      Markdown形式
      ![施設名のイメージ1](https://media1...)
    */

    const markdownRegex =
      /!\[[^\]]*(?:イメージ\s*1|image\s*1)[^\]]*\]\((https:\/\/media1\.tokyodisneyresort\.jp\/[^)\s]+)\)/i;

    let match = text.match(markdownRegex);

    if(match){
      return match[1];
    }

    /*
      HTML形式になっている場合
      <img alt="○○のイメージ1" src="...">
    */

    const htmlRegex =
      /<img[^>]+(?:alt|title)=["'][^"']*(?:イメージ\s*1|image\s*1)[^"']*["'][^>]+src=["'](https:\/\/media1\.tokyodisneyresort\.jp\/[^"']+)["']/i;

    match = text.match(htmlRegex);

    if(match){
      return match[1];
    }

    /*
      属性の順番が逆の場合
    */

    const htmlRegex2 =
      /<img[^>]+src=["'](https:\/\/media1\.tokyodisneyresort\.jp\/[^"']+)["'][^>]+(?:alt|title)=["'][^"']*(?:イメージ\s*1|image\s*1)[^"']*["']/i;

    match = text.match(htmlRegex2);

    if(match){
      return match[1];
    }

    return null;

  }catch(error){

    console.log("画像取得エラー:",error);
    return null;

  }
}


/* =====================================================
   画像表示
===================================================== */

async function loadImage(item, imgElement, placeholder, type){

  placeholder.textContent =
    "公式サイトから画像を取得中…";

  const url =
    type === "attraction"
      ? attractionUrl(item)
      : type === "shop"
        ? shopUrl(item)
        : restaurantUrl(item);

  const imageUrl =
    await getOfficialImage(url,type);

  if(imageUrl){

    imgElement.src = imageUrl;

    imgElement.onload = () => {
      imgElement.style.display = "block";
      placeholder.style.display = "none";
    };

    imgElement.onerror = () => {
      imgElement.style.display = "none";
      placeholder.style.display = "block";
      placeholder.textContent =
        "公式画像を表示できませんでした";
    };

  }else{

    imgElement.style.display = "none";
    placeholder.style.display = "block";
    placeholder.textContent =
      "公式画像を取得できませんでした";

  }

}


/* =====================================================
   カード作成
===================================================== */

function createFacilityCard(item,type){

  const card =
    document.createElement("div");

  card.className = "card";

  const image =
    document.createElement("div");

  image.className = "card-image";

  const placeholder =
    document.createElement("div");

  placeholder.className =
    "image-placeholder";

  placeholder.textContent =
    item.emoji + " 画像を読み込み中…";

  const img =
    document.createElement("img");

  img.alt =
    item.name;

  img.style.display = "none";

  image.appendChild(img);
  image.appendChild(placeholder);

  const body =
    document.createElement("div");

  body.className = "card-body";

  const title =
    document.createElement("div");

  title.className = "card-title";

  title.textContent =
    item.emoji + " " + item.name;

  const area =
    document.createElement("div");

  area.className = "card-area";

  area.textContent =
    item.area;

  const desc =
    document.createElement("div");

  desc.className = "card-desc";

  desc.textContent =
    item.desc || "";

  const buttons =
    document.createElement("div");

  buttons.className =
    "card-buttons";

  const official =
    document.createElement("a");

  official.className =
    "official";

  official.textContent =
    "公式詳細";

  official.href =
    type === "attraction"
      ? attractionUrl(item)
      : type === "shop"
        ? shopUrl(item)
        : restaurantUrl(item);

  official.target =
    "_blank";

  official.rel =
    "noopener";

  if(type === "attraction"){

    const select =
      document.createElement("button");

    select.className =
      "select-btn";

    select.textContent =
      "ここを選択";

    select.onclick =
      () => selectAttraction(item);

    buttons.appendChild(select);

  }

  buttons.appendChild(official);

  body.appendChild(title);
  body.appendChild(area);
  body.appendChild(desc);
  body.appendChild(buttons);

  card.appendChild(image);
  card.appendChild(body);

  /*
    画像取得はカード表示後に行う
  */

  setTimeout(
    () => loadImage(item,img,placeholder,type),
    20
  );

  return card;
}


/* =====================================================
   エリアボタン
===================================================== */

let selectedArea =
  "ワールドバザール";

function renderAreas(){

  const container =
    document.getElementById("areaButtons");

  container.innerHTML = "";

  areas.forEach(area => {

    const button =
      document.createElement("button");

    button.className =
      "area-btn";

    if(area === selectedArea){
      button.classList.add("active");
    }

    button.textContent =
      area;

    button.onclick =
      () => {

        selectedArea =
          area;

        renderAreas();
        renderAttractions();

        /*
          エリア変更時は選択状態をリセット
        */

        document.getElementById(
          "selectedArea"
        ).innerHTML = "";

        document.getElementById(
          "nearbyArea"
        ).innerHTML = "";

      };

    container.appendChild(button);

  });

}


/* =====================================================
   アトラクション表示
===================================================== */

function renderAttractions(){

  const container =
    document.getElementById("attractionList");

  const keyword =
    document.getElementById(
      "searchInput"
    ).value.trim().toLowerCase();

  container.innerHTML = "";

  const filtered =
    attractions.filter(item => {

      const sameArea =
        item.area === selectedArea;

      const match =
        item.name
          .toLowerCase()
          .includes(keyword);

      return sameArea && match;

    });

  if(filtered.length === 0){

    container.innerHTML =
      `<div class="empty">
        該当するアトラクションがありません
      </div>`;

    return;
  }

  filtered.forEach(item => {

    container.appendChild(
      createFacilityCard(
        item,
        "attraction"
      )
    );

  });

}


/* =====================================================
   アトラクション選択
===================================================== */

function selectAttraction(item){

  const selected =
    document.getElementById(
      "selectedArea"
    );

  selected.innerHTML = `
    <div class="selected-box">
      <div style="font-size:12px;opacity:.7;">
        現在地として選択中
      </div>

      <div class="selected-name">
        ${item.emoji} ${item.name}
      </div>

      <div class="selected-area">
        ${item.area}
      </div>

      <div style="
        margin-top:10px;
        font-size:12px;
        line-height:1.6;
        opacity:.85;
      ">
        この施設を基準に、同じエリアの
        アトラクション・レストラン・ショップ・
        フォトスポットを表示しています。
      </div>
    </div>
  `;

  renderNearby(item);

  window.scrollTo({
    top:selected.offsetTop - 80,
    behavior:"smooth"
  });

}


/* =====================================================
   周辺施設
===================================================== */

function renderNearby(attraction){

  const container =
    document.getElementById(
      "nearbyArea"
    );

  container.innerHTML = "";

  /*
    現段階では「同じエリア」を
    周辺施設として扱う。

    次の段階で
    緯度経度を入れて本当の距離順にできる。
  */

  const nearbyAttractions =
    attractions.filter(item =>
      item.area === attraction.area &&
      item.id !== attraction.id
    );

  const nearbyRestaurants =
    restaurants.filter(item =>
      item.area === attraction.area
    );

  const nearbyShops =
    shops.filter(item =>
      item.area === attraction.area
    );

  const nearbyPhotos =
    photoSpots.filter(item =>
      item.area === attraction.area
    );


  /* アトラクション */

  addSection(
    container,
    "🎢 近くのアトラクション",
    nearbyAttractions,
    "attraction"
  );


  /* レストラン */

  addSection(
    container,
    "🍴 近くのレストラン",
    nearbyRestaurants,
    "restaurant"
  );


  /* ショップ */

  addSection(
    container,
    "🛍️ 近くのショップ",
    nearbyShops,
    "shop"
  );


  /* フォトスポット */

  addPhotoSection(
    container,
    "📸 近くのフォトスポット",
    nearbyPhotos
  );

}


/* =====================================================
   セクション追加
===================================================== */

function addSection(
  container,
  title,
  items,
  type
){

  const section =
    document.createElement("div");

  section.className =
    "section";

  const heading =
    document.createElement("div");

  heading.className =
    "section-title";

  heading.textContent =
    title;

  section.appendChild(
    heading
  );

  if(items.length === 0){

    const empty =
      document.createElement("div");

    empty.className =
      "empty";

    empty.textContent =
      "このエリアには登録されていません";

    section.appendChild(
      empty
    );

  }else{

    const grid =
      document.createElement("div");

    grid.className =
      "card-grid";

    items.forEach(item => {

      grid.appendChild(
        createFacilityCard(
          item,
          type
        )
      );

    });

    section.appendChild(grid);

  }

  container.appendChild(section);

}


/* =====================================================
   フォトスポット
===================================================== */

function addPhotoSection(
  container,
  title,
  items
){

  const section =
    document.createElement("div");

  section.className =
    "section";

  const heading =
    document.createElement("div");

  heading.className =
    "section-title";

  heading.textContent =
    title;

  section.appendChild(
    heading
  );

  if(items.length === 0){

    const empty =
      document.createElement("div");

    empty.className =
      "empty";

    empty.textContent =
      "このエリアには登録されていません";

    section.appendChild(
      empty
    );

  }else{

    const grid =
      document.createElement("div");

    grid.className =
      "card-grid";

    items.forEach(item => {

      const card =
        document.createElement("div");

      card.className =
        "photo-card";

      const placeholder =
        document.createElement("div");

      placeholder.className =
        "card-image";

      placeholder.innerHTML =
        `<div class="image-placeholder">
          ${item.emoji}
          <br>
          フォトスポット
        </div>`;

      const body =
        document.createElement("div");

      body.className =
        "photo-body";

      body.innerHTML = `
        <div class="card-title">
          ${item.emoji} ${item.name}
        </div>

        <div class="card-desc">
          ${item.desc}
        </div>

        <div class="source">
          出典：${item.source}
        </div>
      `;

      card.appendChild(
        placeholder
      );

      card.appendChild(
        body
      );

      grid.appendChild(
        card
      );

    });

    section.appendChild(
      grid
    );

  }

  container.appendChild(
    section
  );

}
