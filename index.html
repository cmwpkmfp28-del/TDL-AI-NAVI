<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TDL AI NAVI</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
  background:#f5f6f8;
  color:#222;
}

header{
  background:linear-gradient(135deg,#111827,#374151);
  color:white;
  padding:28px 20px 25px;
}

header h1{
  margin:0;
  font-size:28px;
}

header p{
  margin:7px 0 0;
  opacity:.8;
  font-size:13px;
}

.container{
  max-width:900px;
  margin:auto;
  padding:18px;
}

.select-box{
  background:white;
  border-radius:18px;
  padding:18px;
  box-shadow:0 4px 18px rgba(0,0,0,.06);
  margin-bottom:18px;
}

.select-box label{
  display:block;
  font-weight:bold;
  margin-bottom:9px;
}

select{
  width:100%;
  padding:15px;
  border:1px solid #ddd;
  border-radius:12px;
  background:white;
  font-size:16px;
}

#selectedInfo{
  margin-top:12px;
  color:#666;
  font-size:13px;
}

.category{
  margin-top:24px;
}

.category-title{
  display:flex;
  align-items:center;
  gap:8px;
  font-size:20px;
  font-weight:bold;
  margin-bottom:12px;
}

.cards{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}

.card{
  background:white;
  border-radius:16px;
  padding:15px;
  box-shadow:0 3px 15px rgba(0,0,0,.06);
  display:flex;
  flex-direction:column;
  min-height:150px;
}

.card .emoji{
  font-size:25px;
  margin-bottom:8px;
}

.card h3{
  margin:0 0 5px;
  font-size:16px;
}

.card p{
  margin:0;
  color:#777;
  font-size:12px;
  line-height:1.5;
  flex:1;
}

.card a{
  display:block;
  margin-top:12px;
  padding:10px;
  text-align:center;
  border-radius:10px;
  background:#111827;
  color:white;
  text-decoration:none;
  font-size:13px;
  font-weight:bold;
}

.area{
  display:inline-block;
  margin-top:7px;
  padding:4px 7px;
  border-radius:7px;
  background:#f0f1f3;
  color:#666;
  font-size:11px;
}

.empty{
  background:white;
  padding:18px;
  border-radius:14px;
  color:#777;
  text-align:center;
}

.note{
  margin-top:25px;
  font-size:11px;
  color:#888;
  line-height:1.6;
}

@media(max-width:600px){
  .cards{
    grid-template-columns:1fr;
  }

  header h1{
    font-size:24px;
  }
}
</style>
</head>

<body>

/* =========================

========================= */

/* =========================

========================= */

/* =========================

========================= */

  "ワールドバザール":{
    shops:[
      "グランドエンポーリアム",
      "ディズニー＆カンパニー"
    ],
    restaurants:[
      "リフレッシュメントコーナー"
    ]

  "アドベンチャーランド":{

    restaurants:[

      "クリスタルパレス・レストラン"
    ]
  },

  "ウエスタンランド":{
    shops:[],
    restaurants:[
      "ハングリーベア・レストラン",
      "プラザパビリオン・レストラン"
    ]
  },

  "クリッターカントリー":{
    shops:[],
    restaurants:[

    ]
  },

  "ファンタジーランド":{
    shops:[],
    restaurants:[]
  },

  "トゥーンタウン":{

  },

    restaurants:[

    ]
  }

};


/* =========================

========================= */

const photoInfo = [

  {
    name:"シンデレラ城",
    area:"パーク中央",
    description:"東京ディズニーランドを代表する定番フォトスポット",
    url:"https://www.tokyodisneyresort.jp/dream/photo/tdl_snapphoto.html"
  },

  {
    name:"ディズニーフォト公式情報",
    area:"東京ディズニーランド",
    description:"公式の撮影・フォトサービス情報",
    url:"https://www.tokyodisneyresort.jp/dream/photo/tdl_snapphoto.html"
  }

];


/* =========================
   セレクトボックス生成
========================= */

const select = document.getElementById("attractionSelect");

attractions.forEach(attraction => {

  const option = document.createElement("option");

  option.value = attraction.id;

  option.textContent =
    attraction.name + "　｜　" + attraction.area;

  select.appendChild(option);

});


/* =========================
   カード生成
========================= */

function createCard(item,emoji){

  return `
    <div class="card">

      <div class="emoji">${emoji}</div>

      <h3>${item.name}</h3>

      <span class="area">${item.area}</span>

      <p>${item.description || ""}</p>

      <a href="${item.url}" target="_blank" rel="noopener">
        公式サイトで詳しく見る ↗
      </a>

    </div>
  `;

}


/* =========================
   表示
========================= */

select.addEventListener("change",function(){

  const selected =
    attractions.find(a => a.id === this.value);

  const result =
    document.getElementById("result");

  const info =
    document.getElementById("selectedInfo");

  if(!selected){

    result.innerHTML = "";

    info.textContent =
      "アトラクションを選ぶと、周辺のショップ・フード・写真スポット・アトラクションを表示します。";

    return;

  }


  info.innerHTML =
    `📍 <strong>${selected.name}</strong>（${selected.area}）周辺`;


  const area =
    selected.area;


  /* 周辺アトラクション */

  const nearbyAttractions =
    attractions.filter(a =>

      a.area === area &&
      a.id !== selected.id

    );


  /* 周辺ショップ */

  const nearbyShopNames =
    areaData[area]?.shops || [];

  const nearbyShops =
    shops.filter(shop =>
      nearbyShopNames.includes(shop.name)
    );


  /* 周辺レストラン */

  const nearbyRestaurantNames =
    areaData[area]?.restaurants || [];

  const nearbyRestaurants =
    restaurants.filter(restaurant =>
      nearbyRestaurantNames.includes(restaurant.name)
    );


  /* フォト */

  const nearbyPhotos =
    photoInfo.filter(photo =>

      photo.area === area ||
      photo.area === "パーク中央" ||
      photo.area === "東京ディズニーランド"

    );


  result.innerHTML = `

    <section class="category">

      <div class="category-title">
        🎢 周辺アトラクション
      </div>

      <div class="cards">

        ${
          nearbyAttractions.length

          ?

          nearbyAttractions
            .map(a => createCard({
              name:a.name,
              area:a.area,
              description:"同じエリアのアトラクション",
              url:a.url
            },"🎢"))
            .join("")

          :

          `<div class="empty">
             このエリアの他のアトラクションはありません
           </div>`
        }

      </div>

    </section>


    <section class="category">

      <div class="category-title">
        🛍️ 周辺ショップ
      </div>

      <div class="cards">

        ${
          nearbyShops.length

          ?

          nearbyShops
            .map(shop => createCard(shop,"🛍️"))
            .join("")

          :

          `<div class="empty">
             このエリアのショップ情報を表示できます
           </div>`
        }

      </div>

    </section>


    <section class="category">

      <div class="category-title">
        🍴 周辺フード
      </div>

      <div class="cards">

        ${
          nearbyRestaurants.length

          ?

          nearbyRestaurants
            .map(restaurant =>
              createCard(restaurant,"🍴")
            )
            .join("")

          :

          `<div class="empty">
             このエリアのレストラン情報を表示できます
           </div>`
        }

      </div>

    </section>


    <section class="category">

      <div class="category-title">
        📸 フォトスポット
      </div>

      <div class="cards">

        ${
          nearbyPhotos
            .map(photo =>
              createCard(photo,"📸")
            )
            .join("")
        }

      </div>

    </section>


    <div class="note">
      ※施設の運営状況・営業時間・休止情報・スタンバイパス等は、
      当日の東京ディズニーリゾート公式サイト／アプリで確認してください。
    </div>

  `;

});

</script>
